const safeParseJSON=(raw,fallback=null)=>{try{return raw?JSON.parse(raw):fallback;}catch(e){return fallback;}};
const isPetHabitBackupMetadataKey=(key)=>key===SAVE_RESTORE_POINTER_KEY||
  key==="petHabitLastMigrationSnapshot"||key==="petHabitLastRestoreAt"||
  key==="petHabitMigrationError"||key==="petHabitRestoreError"||
  key.startsWith(SAVE_SNAPSHOT_PREFIX);
const isPetHabitOfficialSaveKey=(key)=>key==="habitKingdom"||key==="lastLogin_hk"||key==="lastStreak_hk"||
  key==="musicOn_hk"||key==="weather_hk"||key==="parkPetPan_hk"||key==="parkKidPan_hk"||
  key==="outingScene_hk"||key==="petHabitFamily_v1"||
  key.startsWith("habitKingdom_player_")||key.startsWith("lastLogin_hk_")||key.startsWith("lastStreak_hk_")||
  key.startsWith("musicOn_hk_")||key.startsWith("weather_hk_")||key.startsWith("parkPetPan_hk_")||
  key.startsWith("parkKidPan_hk_")||key.startsWith("outingScene_hk_")||
  key.startsWith("founderGift_v1_claimed")||key.startsWith("petHabitRedeemedCodes_")||
  key.startsWith("petHabitRewardLedger_")||key.startsWith("roomDecorPos_hk")||
  key.startsWith("petHabitAdventureKeys_")||key.startsWith("petHabitAdventureKeyGrant_")||
  key.startsWith("petHabitGoogleLocalBinding_")||
  key==="petHabitGift_schoolScene_20260701_claimed"||key==="petHabitGift_schoolScene_20260701_ceremonySeen";
const cleanupSaveSnapshots=()=>{
  const snaps=Object.keys(localStorage).filter(k=>k.startsWith(SAVE_SNAPSHOT_PREFIX)).map(k=>{
    const snap=safeParseJSON(localStorage.getItem(k),null);
    return {key:k,createdAt:snap&&snap.createdAt?snap.createdAt:k.replace(SAVE_SNAPSHOT_PREFIX,"")};
  }).sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt)));
  snaps.slice(5).forEach(s=>localStorage.removeItem(s.key));
  if(snaps[0]&&localStorage.getItem(snaps[0].key)!==null)localStorage.setItem(SAVE_RESTORE_POINTER_KEY,snaps[0].key);
  else localStorage.removeItem(SAVE_RESTORE_POINTER_KEY);
};
const backupLocalStorageSnapshot=(reason)=>{
  try{
    const key=SAVE_SNAPSHOT_PREFIX+new Date().toISOString();
    const snapshot={version:SAVE_PROTECTION_VERSION,reason,createdAt:new Date().toISOString(),localStorage:{}};
    Object.keys(localStorage).forEach(k=>{
      if(isPetHabitOfficialSaveKey(k)&&!isPetHabitBackupMetadataKey(k))snapshot.localStorage[k]=localStorage.getItem(k);
    });
    localStorage.setItem(key,JSON.stringify(snapshot));
    localStorage.setItem(SAVE_RESTORE_POINTER_KEY,key);
    cleanupSaveSnapshots();
    return key;
  }catch(e){return null;}
};
const restoreLatestSafeSnapshot=()=>{
  try{
    const targetKey=localStorage.getItem(SAVE_RESTORE_POINTER_KEY);
    backupLocalStorageSnapshot("restore-before");
    const snap=safeParseJSON(targetKey&&localStorage.getItem(targetKey),null);
    if(!snap||!snap.localStorage)return false;
    Object.keys(snap.localStorage).forEach(k=>{
      if(!isPetHabitOfficialSaveKey(k)||isPetHabitBackupMetadataKey(k))return;
      if(snap.localStorage[k]===null||snap.localStorage[k]===undefined)localStorage.removeItem(k);
      else localStorage.setItem(k,snap.localStorage[k]);
    });
    Object.keys(localStorage).forEach(k=>{
      if(isPetHabitOfficialSaveKey(k)&&!isPetHabitBackupMetadataKey(k)&&!Object.prototype.hasOwnProperty.call(snap.localStorage,k)){
        localStorage.removeItem(k);
      }
    });
    localStorage.setItem("petHabitLastRestoreAt",new Date().toISOString());
    setTimeout(()=>location.reload(),120);
    return true;
  }catch(e){
    localStorage.setItem("petHabitRestoreError",String(e&&e.message||e));
    return false;
  }
};
window.petHabitRestoreLatestSafeSnapshot=restoreLatestSafeSnapshot;
const migrateSaveDataSafely=()=>{
  try{
    const flag="petHabitSchemaVersion";
    const current=Number(localStorage.getItem(flag)||"0");
    if(current>=APP_SCHEMA_VERSION)return true;
    const snapshotKey=backupLocalStorageSnapshot("schema-"+current+"-to-"+APP_SCHEMA_VERSION);
    const familyRaw=localStorage.getItem("petHabitFamily_v1");
    const writes=[];
    if(familyRaw){
      const family=safeParseJSON(familyRaw,null);
      if(family&&Array.isArray(family.players)){
        const migratedFamily={...family,players:family.players.map(p=>({
          ...p,
          localSaveId:p.localSaveId||makeLocalSaveId(),
          futureGoogleUserId:p.futureGoogleUserId||"",
          loginStatus:p.loginStatus||"local",
          cloudSaveStatus:p.cloudSaveStatus||"not_connected"
        }))};
        const validPlayers=Array.isArray(migratedFamily.players)&&migratedFamily.players.length>0&&migratedFamily.players.every((p,idx)=>{
          const old=family.players[idx]||{};
          return p&&p.id===old.id&&p.storageKey===old.storageKey&&p.storageKey&&safeParseJSON(localStorage.getItem(p.storageKey)||"{}",{})!==null;
        });
        if(!validPlayers)throw new Error("Migration validation failed: invalid family players");
        writes.push(["petHabitFamily_v1",JSON.stringify(migratedFamily)]);
      }
    }
    const mainRaw=localStorage.getItem("habitKingdom");
    if(mainRaw&&safeParseJSON(mainRaw,null)===null)throw new Error("Migration validation failed: habitKingdom is not valid JSON");
    writes.forEach(([k,v])=>localStorage.setItem(k,v));
    localStorage.setItem(flag,String(APP_SCHEMA_VERSION));
    localStorage.setItem("petHabitLastMigrationSnapshot",snapshotKey||"");
    return true;
  }catch(e){
    localStorage.setItem("petHabitMigrationError",String(e&&e.message||e));
    return false;
  }
};

  return window.__petHabitGoogleScriptPromise;

    let normalized=payload.replace(/-/g,"+").replace(/_/g,"/");
    normalized+=Array((4-normalized.length%4)%4+1).join("=");

const ADVENTURE_KEY_MAX=5;
const ADVENTURE_KEY_TTL_DAYS=3;
const ymd=(date=new Date())=>{
  const d=new Date(date);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
};
const addDaysISO=(date,days)=>{
  const d=new Date(date);
  d.setDate(d.getDate()+days);
  return d.toISOString();
};
const AdventureKeyManager={
  key:(playerId)=>"petHabitAdventureKeys_"+(playerId||"solo"),
  grantKey:(grantId)=>"petHabitAdventureKeyGrant_"+grantId,
  normalize:(keys,now=new Date())=>{
    const t=now.getTime();
    return (Array.isArray(keys)?keys:[])
      .filter(k=>k&&k.id&&k.expiresAt&&new Date(k.expiresAt).getTime()>t)
      .sort((a,b)=>new Date(a.expiresAt)-new Date(b.expiresAt))
      .slice(0,ADVENTURE_KEY_MAX);
  },
  read:(playerId)=>{
    const keys=safeParseJSON(localStorage.getItem(AdventureKeyManager.key(playerId)),[]);
    const before=Array.isArray(keys)?keys:[];
    const normalized=AdventureKeyManager.normalize(keys);
    const expiredCount=before.length-normalized.length;
    localStorage.setItem(AdventureKeyManager.key(playerId),JSON.stringify(normalized));
    if(isFeatureEnabled("adventure")&&expiredCount>0)trackSafe("adventure_key_expired",{expired_count:expiredCount,remaining_count:normalized.length});
    return normalized;
  },
  grant:(playerId,source,grantId,date=new Date())=>{
    if(!isFeatureEnabled("adventure")){
      const keys=AdventureKeyManager.read(playerId);
      return {granted:false,reason:"feature_disabled",keys};
    }
    const finalGrantId=grantId||source+":"+(playerId||"solo")+":"+ymd(date);
    if(localStorage.getItem(AdventureKeyManager.grantKey(finalGrantId))==="true"){
      const keys=AdventureKeyManager.read(playerId);
      trackSafe("adventure_key_earned",{source,grant_id:finalGrantId,key_count:keys.length,expires_at:"",result:"skipped_duplicate"});
      return {granted:false,reason:"duplicate",keys};
    }
    const keys=AdventureKeyManager.read(playerId);
    if(keys.length>=ADVENTURE_KEY_MAX){
      localStorage.setItem(AdventureKeyManager.grantKey(finalGrantId),"true");
      trackSafe("adventure_key_earned",{source,grant_id:finalGrantId,key_count:keys.length,expires_at:"",result:"skipped_full"});
      return {granted:false,reason:"full",keys};
    }
    const key={id:"key_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),earnedAt:new Date(date).toISOString(),expiresAt:addDaysISO(date,ADVENTURE_KEY_TTL_DAYS),source,grantId:finalGrantId};
    const next=AdventureKeyManager.normalize([...keys,key],date);
    localStorage.setItem(AdventureKeyManager.key(playerId),JSON.stringify(next));
    localStorage.setItem(AdventureKeyManager.grantKey(finalGrantId),"true");
    trackSafe("adventure_key_earned",{source,grant_id:finalGrantId,key_count:next.length,expires_at:key.expiresAt,result:"granted"});
    return {granted:true,key,keys:next};
  },
  consume:(playerId)=>{
    const keys=AdventureKeyManager.read(playerId);
    if(!keys.length)return {consumed:false,keys};
    const [used,...rest]=keys;
    localStorage.setItem(AdventureKeyManager.key(playerId),JSON.stringify(rest));
    return {consumed:true,key:used,keys:rest};
  }
};

function PetImg({petType,mood,hunger,running,eating,isNight,sleeping,size,style,hat,neck,back,body,acc}){
  const t=petType||"horse";
  const m=mood==null?4:mood;
  /* Updated by Claude on 2026/06/23
     Reason: state priority, matching the asset set's 4 emotional states:
     1) sleeping (neglect.sleeping — player was away 3+ days, pet dozed off waiting)
        is the strongest, most deliberate signal in the existing game logic, so it
        wins over everything else -> Sleep art.
     2) mood<=1 (today's habits/interaction are low) -> Lonely art (sad/sulky face,
        distinct from "sleeping" -- this is "needs attention today", not "away for
        days").
     3) isNight && not actively playing -> ambient Sleep art, so the pet looks
        sleepy in the evening even without the multi-day neglect trigger.
     4) mood>=4 -> Happy art. Otherwise -> Normal art (the default/idle look). */
  let state="normal";
  if(sleeping)state="sleep";
  else if(m<=1)state="lonely";
  else if(isNight&&!running&&!eating)state="sleep";
  else if(m>=4)state="happy";
  const key=t+"_"+state;
  const src=IMG[key]||IMG[t+"_normal"]||IMG.horse_normal;
  const s=size||1;
  const hatItem=OUTFITS.find(i=>i.id===hat),
    neckItem=OUTFITS.find(i=>i.id===neck||i.id===acc),
    backItem=OUTFITS.find(i=>i.id===back),
    bodyItem=OUTFITS.find(i=>i.id===body);
  const anchors=PET_ACCESSORY_ANCHORS[t]||PET_ACCESSORY_ANCHORS.dog;
  const showAccessories=!sleeping&&state!=="sleep";

    </div>;
  };
  return <div style={{display:"inline-block",position:"relative",animation:running?"none":"float 3s ease-in-out infinite"}}>
    <img src={assetSrc(src)} onError={handleImgError} draggable={false} alt="" style={{width:160*s,height:150*s,

/* ═══════════════ AUDIO SYSTEM ═══════════════ */
function createAudio(){
  let ctx=null,musicNodes=[],musicTimers=[],musicOn=true,musicStarted=false;
  const getCtx=()=>{
    if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    return ctx;
  };
  const clearMusic=()=>{
    musicTimers.forEach(t=>clearTimeout(t));musicTimers=[];
    musicNodes.forEach(n=>{try{n.stop();}catch(e){}});musicNodes=[];
    musicStarted=false;
  };
  const beep=(freq,dur,vol,type)=>{
    try{
      const c=getCtx(),o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type=type||"sine";o.frequency.setValueAtTime(freq,c.currentTime);
      g.gain.setValueAtTime(vol||0.3,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.start(c.currentTime);o.stop(c.currentTime+dur);
    }catch(e){}
  };
  const playChord=(freqs,dur,vol)=>{freqs.forEach(f=>beep(f,dur,vol||0.15));};
  return{
    check:()=>{beep(523,.1,.3);setTimeout(()=>beep(659,.1,.3),80);setTimeout(()=>beep(784,.15,.35),160);},
    approve:()=>{playChord([523,659,784],.4,.2);setTimeout(()=>playChord([659,784,1047],.5,.18),200);},
    feed:()=>{beep(392,.08,.2,"triangle");setTimeout(()=>beep(440,.08,.2,"triangle"),120);setTimeout(()=>beep(392,.08,.2,"triangle"),240);},
    pat:()=>{beep(880,.08,.15,"sine");setTimeout(()=>beep(1047,.08,.15),60);setTimeout(()=>beep(1319,.12,.15),120);},
    achieve:()=>{[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.2,.25),i*100));setTimeout(()=>playChord([659,784,1047],.6,.2),450);},
    login:()=>{beep(528,.15,.2,"sine");setTimeout(()=>beep(660,.15,.2),150);setTimeout(()=>beep(792,.2,.2),300);},
    weekend:()=>{playChord([523,659],.15,.2);setTimeout(()=>playChord([659,784],.15,.2),200);setTimeout(()=>playChord([784,1047],.3,.2),400);},
    clean:()=>{beep(300,.05,.15,"sawtooth");setTimeout(()=>beep(600,.1,.15,"sine"),80);setTimeout(()=>beep(900,.15,.15,"sine"),160);},
    buy:()=>{beep(440,.08,.2);setTimeout(()=>beep(550,.08,.2),100);setTimeout(()=>beep(660,.12,.2),200);},
    bath:()=>{beep(400,.06,.15,"triangle");setTimeout(()=>beep(500,.06,.15,"triangle"),80);setTimeout(()=>beep(450,.06,.15,"triangle"),160);setTimeout(()=>beep(520,.1,.15,"triangle"),240);},
    flower:()=>{beep(659,.1,.2,"sine");setTimeout(()=>beep(784,.1,.2),100);setTimeout(()=>beep(1047,.15,.2),200);},
    ball:()=>{beep(300,.05,.2,"triangle");setTimeout(()=>beep(200,.1,.15,"triangle"),100);},
    startMusic:(onOff)=>{
      musicOn=onOff;
      if(!onOff){clearMusic();return;}
      if(musicStarted)return;
      clearMusic();musicStarted=true;
      try{
        const c=getCtx();
        const pNote=(freq,st,dur,vol,type)=>{
          const o=c.createOscillator(),g=c.createGain();
          o.connect(g);g.connect(c.destination);
          o.type=type||"triangle";o.frequency.setValueAtTime(freq,st);
          g.gain.setValueAtTime(0,st);
          g.gain.linearRampToValueAtTime(vol,st+0.03);
          g.gain.exponentialRampToValueAtTime(Math.max(vol*0.25,0.001),st+dur*0.62);
          g.gain.exponentialRampToValueAtTime(0.001,st+dur*1.25);
          o.start(st);o.stop(st+dur*1.35);musicNodes.push(o);
        };
        const bassSeq=[261,196,220,164,174,261,174,196];
        const melody=[523,587,659,784,659,587,523,392,440,523,587,523];
        const beatLen=1.8;
        let loopT=c.currentTime+0.35;
        const playLoop=()=>{
          if(!musicOn){clearMusic();return;}
          bassSeq.forEach((freq,i)=>{pNote(freq,loopT+i*beatLen,beatLen*.75,0.014,"sine");});
          melody.forEach((freq,i)=>{pNote(freq,loopT+i*.55,.46,0.020,"triangle");});
          const totalDur=bassSeq.length*beatLen;
          loopT+=totalDur+1.0;
          musicTimers.push(setTimeout(playLoop,(totalDur+0.7)*1000));
        };
        playLoop();
      }catch(e){clearMusic();}
    },
    setMusicOn:(v)=>{musicOn=v;if(!v)clearMusic();},
    stopMusic:()=>clearMusic()
  };
}

function NumPad({title,subtitle,onSuccess,onClose,correctPin}){
  const [inp,setInp]=useState("");
  const [shake,setShake]=useState(false);
  const keys=["1","2","3","4","5","6","7","8","9","","0","⌫"];
  const press=(k)=>{
    if(k==="⌫"){setInp(p=>p.slice(0,-1));return;}
    if(!k) return;
    const next=inp+k;
    setInp(next);
    if(next.length===correctPin.length){
      if(next===correctPin){onSuccess();}
      else{setShake(true);setTimeout(()=>{setShake(false);setInp("");},600);}
    }
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(60,20,0,.45)",backdropFilter:"blur(8px)",

/* ═══════════════ IMPORT LOCAL DATA MODAL (Added by Claude 2026/06/29) ═══════════════
   Reason: front-end-only piece of the "登入後偵測舊資料" flow from the Phase 1
   login plan. This component and the helper below do NOT call Supabase or any
   network API — they only read localStorage (which is safe, no connection
   needed) and render the UI. Codex hooks this in by:
     1. After a successful Google login + family/user creation, call
        hasLocalGameData(storageKey) to decide whether to show this modal.
     2. Render <ImportLocalDataModal onImport={...} onSkip={...}/> and put the
        real "read localStorage -> write to Supabase" logic inside onImport,
        and whatever "mark as skipped, don't ask again" logic inside onSkip.
   This file does not call either callback itself anywhere — it's wired to
   nothing yet, by design, until the real login flow exists to trigger it. */
function hasLocalGameData(storageKey){
  try{
    const raw=localStorage.getItem(storageKey||"habitKingdom");
    return !!raw;
  }catch(e){return false;}
}
async function importPetHabitBackupFile(file,setMessage){
  try{
    const payload=JSON.parse(await file.text());
    const saved=payload&&payload.localStorage;
    if(!saved||typeof saved!=="object"||!Object.keys(saved).some(isPetHabitSaveKey))throw new Error("invalid backup");
    if(!window.confirm("匯入會覆蓋目前資料，是否確認？"))return false;
    getPetHabitSaveKeys().forEach(key=>localStorage.removeItem(key));
    Object.keys(saved).filter(isPetHabitSaveKey).forEach(key=>{
      if(typeof saved[key]==="string")localStorage.setItem(key,saved[key]);
    });
    window.location.reload();
    return true;
  }catch(err){
    if(setMessage)setMessage("❌ 無法匯入：這不是有效的 Pet Habit 備份檔");
    return false;
  }
}
function ImportLocalDataModal({onImport,onSkip}){
  return <Overlay onClose={onSkip}>
    <div style={{fontSize:40,textAlign:"center",marginBottom:8}}>📦</div>
    {Sh("發現此裝置已有遊戲紀錄")}
    <div style={{fontSize:13,color:C.soft,fontWeight:800,textAlign:"center",lineHeight:1.6,marginBottom:20,padding:"0 8px"}}>
      是否要把這個裝置上的進度，匯入到目前的帳號？
    </div>
    <button className="btn" onClick={onImport} style={{...bub(C.orange),width:"100%",padding:"13px 0",
      borderRadius:999,fontSize:15,fontWeight:900,color:"#fff",border:"none",marginBottom:10,
      boxShadow:"0 5px 0 rgba(180,80,0,.25)"}}>📥 匯入這份紀錄</button>
    <button className="btn" onClick={onSkip} style={{...bub(C.light),width:"100%",padding:"11px 0",
      borderRadius:999,fontSize:13,fontWeight:900,color:C.soft,border:"none"}}>略過，從新帳號開始</button>
  </Overlay>;
}

/* ═══════════════ TOAST ═══════════════ */
function Toast({msg,color}){
  if(!msg)return null;
  return(
    <div style={{position:"fixed",top:20,left:"50%",transform:"translateX(-50%)",
      ...bub(color||C.butter),borderRadius:999,
      padding:"10px 22px",fontWeight:900,fontSize:14,zIndex:9999,
      color:C.brown,animation:"bIn .38s",whiteSpace:"nowrap",maxWidth:"88vw",textAlign:"center"}}>
      {msg}
    </div>);
}

/* ═══════════════ ONBOARDING ═══════════════ */
/* Updated by Claude on 2026/06/23
   Reason: New component for the forced one-time pet reselection flow. Per requirement:
   "本次更新後，所有玩家進入遊戲時，都直接進入「選擇寵物」畫面一次" — triggered when
   profile exists but profile.petUpdate20260623Completed is not true. This is
   intentionally NOT the full Onboarding flow (no name/PIN/task setup) — it's a single
   lightweight screen so existing players aren't forced to redo setup. On confirm:
   only profile.petType and profile.petUpdate20260623Completed are updated; points,
   tasks, checked, owned, equipped, backpack, hunger, diary, wishes, bonusTasks,
   achievements, streak, petMood, poops, neglect are all left completely untouched
   (the caller spreads {...profile} so nothing else in profile is touched either).
   No data is cleared, no migration logic beyond this single field swap. */
function PetReselect({currentPetType,onConfirm}){
  const [petType,setPet]=useState(
    PETS.some(p=>p.id===currentPetType)?currentPetType:"horse"
  );
  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#FFFBF0,#FFF5E8,#FFF0F8)",
      display:"flex",alignItems:"center",justifyContent:"center",padding:20,overflowY:"auto"}}>
      <div style={{...cardS(C.card),padding:"28px 20px",width:"100%",maxWidth:440}}>
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:40,marginBottom:8}}>🎉</div>
          <div style={{fontSize:19,fontWeight:900,color:C.brown,marginBottom:8}}>寵物王國更新囉！</div>
          <div style={{fontSize:12,color:C.soft,fontWeight:800,lineHeight:1.7}}>
            請選一位新的小夥伴陪你繼續冒險。<br/>
            <span style={{fontSize:10,color:"#9A7040"}}>你的星星、任務紀錄和房間佈置都會保留喔 💛</span>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}>
          {PETS.map(p=>(
            <button key={p.id} className="btn" onClick={()=>setPet(p.id)} style={{
              ...bub(petType===p.id?C.yellow:p.c+"28"),borderRadius:20,padding:"14px 10px",textAlign:"center",
              outline:petType===p.id?"3px solid "+C.butter:"none",
              boxShadow:petType===p.id?"0 6px 0 rgba(180,120,0,.18)":"0 4px 0 rgba(150,80,0,.07)"}}>
              <div style={{animation:"float 3s infinite",marginBottom:6}}>
                <PetView petType={p.id} level={1} mood={4} hunger={80} size={.42}/>
              </div>
              <div style={{fontSize:12,fontWeight:900,color:C.brown}}>{p.label}</div>
              <div style={{fontSize:9,color:C.soft,fontWeight:700,marginTop:2}}>{p.desc}</div>
            </button>))}
        </div>
        <button className="btn" onClick={()=>onConfirm(petType)} style={{
          ...bub(C.orange),width:"100%",padding:"15px 0",borderRadius:999,
          fontSize:16,fontWeight:900,color:"#fff",boxShadow:"0 6px 0 rgba(180,80,0,.2)"}}>
          🌟 就選這隻！繼續冒險
        </button>
      </div>
    </div>);
}

function Onboarding({onDone,initialKidName}){
  const [step,setStep]=useState(0);
  const [petType,setPet]=useState("horse");
  const [kidName,setKid]=useState(initialKidName||"");
  const [gender,setGender]=useState("girl");
  const [petName,setPName]=useState("");
  const [pin,setPin]=useState("");
  const [pin2,setPin2]=useState("");
  const [err,setErr]=useState("");
  const [tasks,setTasks]=useState(DEFAULT_TASKS);
  const [editIdx,setEditIdx]=useState(null);
  const [editLabel,setEditLabel]=useState("");
  const [editPts,setEditPts]=useState(10);
  const [editIcon,setEditIcon]=useState("⭐");
  const [newLabel,setNewLabel]=useState("");
  const [newPts,setNewPts]=useState(10);
  const [newIcon,setNewIcon]=useState("⭐");
  const [guideOpen,setGuideOpen]=useState(false);
  const [approvalMode,setApprovalMode]=useState("approval");
  const cur=PETS.find(p=>p.id===petType);
  const totalPts=tasks.reduce((a,t)=>a+t.pts,0);

  // 6 steps: 0=welcome, 1=pet, 2=kidName, 3=petName, 4=tasks, 5=pin
  const next=()=>{
    setErr("");
    if(step===2&&!kidName.trim())return setErr("請輸入你的名字！");
    if(step===4){
      if(totalPts>100)return setErr("今日星星超過100顆了，請調整一下 😊");
      if(tasks.length===0)return setErr("至少需要一個小約定！");
    }
    if(step===5){
      if(pin.length<4)return setErr("請設定至少4位數字密碼！");
      if(pin!==pin2)return setErr("兩次密碼不一樣喔！");
      trackSafe("create_character",{pet:petType,gender:gender,taskCount:tasks.length});
      onDone({kidName:kidName.trim(),petName:petName.trim()||"剛出生的小寶寶",pin,petType,tasks,gender,approvalMode,
        /* Updated by Claude on 2026/06/23 — new players pick from the new 4-pet roster
           during normal onboarding, so they should never see the PetReselect screen.
           Also include default outfit (casual) based on gender. */
        petUpdate20260623Completed:true});
      // 回傳後在父組件設置預設衣服
      return;
    }
    setStep(s=>s+1);
  };

  const removeTask=(id)=>setTasks(ts=>ts.filter(t=>t.id!==id));
  const addTask=()=>{
    if(!newLabel.trim())return;
    if(totalPts+newPts>100)return setErr("加了這個小約定會超過100顆星星喔 😊");
    setTasks(ts=>[...ts,{id:Date.now(),icon:newIcon,label:newLabel.trim(),pts:newPts}]);
    setNewLabel("");setNewPts(10);setNewIcon("⭐");setErr("");
  };
  const saveEdit=()=>{
    if(!editLabel.trim())return;
    const next=tasks.filter(t=>t.id!==editIdx).reduce((a,t)=>a+t.pts,0)+editPts;
    if(next>100)return setErr("修改後會超過100顆星星喔 😊");
    setTasks(ts=>ts.map(t=>t.id===editIdx?{...t,label:editLabel,pts:editPts,icon:editIcon}:t));
    setEditIdx(null);setErr("");
  };

  const GUIDE=[
    {icon:"🌱",title:"第一次使用",text:"跟孩子一起選寵物、開一場家庭會議，約5分鐘完成！"},
    {icon:"✅",title:"每天怎麼用",text:"孩子完成小約定後打勾，爸媽陪伴確認，星星就入帳囉！"},
    {icon:"⭐",title:"星星",text:"每日登入 +5，完成小約定最多 +100，可以買食物、玩具餵寵物並實現許的願望！"},
    {icon:"🌠",title:"願望清單",text:"孩子許願 → 爸媽設定星星數 → 孩子努力存夠 → 爸媽決定實現"},
    {icon:"🎵",title:"音樂",text:"孩子可以在首頁直接開關！"},
  ];

  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#FFFBF0,#FFF5E8,#FFF0F8)",
      display:"flex",alignItems:"center",justifyContent:"center",padding:20,overflowY:"auto"}}>
      <div style={{...cardS(C.card),padding:"28px 20px",width:"100%",maxWidth:440}}>

        {step>0&&<div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:22}}>
          {[1,2,3,4,5].map(i=>(
            <div key={i} style={{height:9,width:i===step?26:9,borderRadius:999,
              background:i===step?C.orange:i<step?C.butter:"#f0e0c0",transition:"all .3s"}}/>))}
        </div>}

        {step===0&&<>
          <div style={{textAlign:"center",marginBottom:12}}>
            <div style={{display:"inline-flex",alignItems:"center",gap:6,...bub(C.yellow,999),
              border:"none",padding:"6px 12px",fontSize:11,fontWeight:900,color:C.brown,marginBottom:7}}>
              <span>🌱</span><span>每天一點點，一起變厲害</span>
            </div>
            <div style={{fontSize:25,fontWeight:900,color:C.brown,marginBottom:4,letterSpacing:".02em"}}>寵物習慣王國</div>
            <div style={{fontSize:12,color:C.soft,fontWeight:800,lineHeight:1.7}}>
              選一位小主人，和你的寵物展開新生活。
            </div>
          </div>

          <div style={{position:"relative",height:224,margin:"0 -8px 12px",overflow:"hidden",
            borderRadius:28,background:"linear-gradient(180deg,#DDF5FF 0%,#FFF7D6 56%,#CDEFA8 57%,#A8DA83 100%)",
            border:"3px solid #fff",boxShadow:"0 7px 0 rgba(106,74,53,.10),0 0 0 2px rgba(232,190,122,.18)"}}>
            <div style={{position:"absolute",width:54,height:54,borderRadius:"50%",background:"#FFF1A8",top:15,right:23,
              boxShadow:"0 0 24px rgba(255,216,91,.65)"}}/>
            <div style={{position:"absolute",top:23,left:18,fontSize:28,opacity:.82}}>☁️</div>
            <div style={{position:"absolute",right:10,bottom:35,fontSize:31}}>🌳</div>
            <div style={{position:"absolute",left:8,bottom:26,fontSize:24}}>🌼</div>
            <OwnerPreview gender="girl" size={.86} style={{position:"absolute",left:-8,bottom:-3,zIndex:2,animation:"float 3.5s ease-in-out infinite"}}/>
            <OwnerPreview gender="boy" size={.86} style={{position:"absolute",right:-9,bottom:-3,zIndex:2,animation:"float 3.5s .5s ease-in-out infinite"}}/>
            <div style={{position:"absolute",left:"50%",bottom:1,transform:"translateX(-50%)",zIndex:3,
              width:152,height:112,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
              <PetView petType="horse" level={2} mood={5} hunger={90} size={.54}/>
            </div>
            <div style={{position:"absolute",left:"50%",bottom:3,transform:"translateX(-50%)",width:150,height:16,
              borderRadius:"50%",background:"rgba(73,115,51,.15)",filter:"blur(2px)"}}/>
          </div>
          <div style={{...cardS(C.light),marginBottom:14,overflow:"hidden"}}>
            <button className="btn" onClick={()=>setGuideOpen(g=>!g)}
              style={{width:"100%",padding:"13px 16px",background:"transparent",
                display:"flex",alignItems:"center",justifyContent:"space-between",border:"none",boxShadow:"none"}}>
              <span style={{fontSize:13,fontWeight:900,color:C.brown}}>📖 給爸媽的小說明</span>
              <span style={{fontSize:16,color:C.soft,transition:"transform .3s",display:"inline-block",
                transform:guideOpen?"rotate(180deg)":"rotate(0deg)"}}>▾</span>
            </button>
            {guideOpen&&<div style={{padding:"0 16px 16px",display:"flex",flexDirection:"column",gap:12}}>
              <div style={{...bub(C.yellow,16),padding:"8px 12px",border:"none",textAlign:"center"}}>
                <span style={{fontSize:12,fontWeight:900,color:C.brown}}>適合 6-12 歲 🌟</span>
              </div>
              {GUIDE.map(g=>(
                <div key={g.title} style={{display:"flex",gap:10,alignItems:"flex-start"}}>
                  <span style={{fontSize:18,flexShrink:0}}>{g.icon}</span>
                  <div>
                    <div style={{fontSize:12,fontWeight:900,color:C.brown,marginBottom:2}}>{g.title}</div>
                    <div style={{fontSize:11,color:C.soft,fontWeight:800,lineHeight:1.6}}>{g.text}</div>
                  </div>
                </div>
              ))}
            </div>}
          </div>
          <button className="btn" onClick={next} style={{
            ...bub(C.orange),width:"100%",padding:"15px 0",borderRadius:999,
            fontSize:16,fontWeight:900,color:"#fff",boxShadow:"0 6px 0 rgba(180,80,0,.2)"}}>
            🌟 開始我的冒險
          </button>
        </>}

        {step===1&&<>
          <div style={{fontSize:21,fontWeight:900,color:C.brown,textAlign:"center",marginBottom:6}}>選你的寵物夥伴！🌟</div>
          <div style={{fontSize:12,color:C.soft,fontWeight:800,textAlign:"center",marginBottom:16}}>牠會一直陪著你！</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {PETS.map(p=>(
              <button key={p.id} className="btn" onClick={()=>setPet(p.id)} style={{
                ...bub(petType===p.id?C.yellow:p.c+"28"),borderRadius:20,padding:"14px 10px",textAlign:"center",
                outline:petType===p.id?"3px solid "+C.butter:"none",
                boxShadow:petType===p.id?"0 6px 0 rgba(180,120,0,.18)":"0 4px 0 rgba(150,80,0,.07)"}}>
                <div style={{animation:"float 3s infinite",marginBottom:6}}>
                  <PetView petType={p.id} level={1} mood={4} hunger={80} size={.42}/>
                </div>
                <div style={{fontSize:12,fontWeight:900,color:C.brown}}>{p.label}</div>
                <div style={{fontSize:9,color:C.soft,fontWeight:700,marginTop:2}}>{p.desc}</div>
              </button>))}
          </div>
        </>}

        {step===2&&<>
          <div style={{fontSize:21,fontWeight:900,color:C.brown,textAlign:"center",marginBottom:6}}>創造你的小主人 🌟</div>
          <div style={{fontSize:12,color:C.soft,fontWeight:800,textAlign:"center",marginBottom:12}}>讓{cur.label}認識你吧！</div>
          {/* 並排預覽男生女生，方便對比 */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:12,alignItems:"flex-end",justifyContent:"center"}}>
            <div style={{textAlign:"center",padding:"8px",borderRadius:16,background:gender==="boy"?C.yellow:C.light,transition:"all .25s"}}>
              <div style={{height:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
                <OwnerImg gender="boy" size={.65}/>
              </div>
              <div style={{fontSize:11,fontWeight:900,color:C.brown,marginTop:4}}>👦 男生</div>
            </div>
            <div style={{textAlign:"center",padding:"8px",borderRadius:16,background:gender==="girl"?C.yellow:C.light,transition:"all .25s"}}>
              <div style={{height:100,display:"flex",alignItems:"flex-end",justifyContent:"center"}}>
                <OwnerImg gender="girl" size={.65}/>
              </div>
              <div style={{fontSize:11,fontWeight:900,color:C.brown,marginTop:4}}>👧 女生</div>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:10}}>
            {[["boy","選擇 👦 男生"],["girl","選擇 👧 女生"]].map(([k,l])=>(
              <button key={k} className="btn" onClick={()=>setGender(k)}
                style={{...bub(gender===k?C.yellow:C.light,16),padding:"10px 0",fontSize:12,
                  fontWeight:900,color:C.brown,border:"none",outline:gender===k?"3px solid "+C.butter:"none"}}>{l}</button>))}
          </div>
          <div style={{...bub(C.light),borderRadius:20,padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:24}}>{gender==="boy"?"👦":"👧"}</span>
            <input style={{flex:1,fontSize:15,fontWeight:800,color:C.brown}} placeholder="輸入你的名字…"
              value={kidName} onChange={e=>setKid(e.target.value)} onKeyDown={e=>e.key==="Enter"&&next()} maxLength={8} autoFocus/>
          </div>
        </>}

        {step===3&&<>
          <div style={{fontSize:21,fontWeight:900,color:C.brown,textAlign:"center",marginBottom:6}}>幫牠取個名字！{cur.emoji}</div>
          <div style={{fontSize:12,color:C.soft,fontWeight:800,textAlign:"center",marginBottom:10}}>不取名字也沒關係喔！</div>
          <div style={{textAlign:"center",marginBottom:10,animation:"float 3s infinite"}}>
            <PetView petType={petType} level={1} mood={4} hunger={80} size={.78}/>
          </div>
          <div style={{...bub(C.light),borderRadius:20,padding:"12px 16px",display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:24}}>{cur.emoji}</span>
            <input style={{flex:1,fontSize:15,fontWeight:800,color:C.brown}} placeholder="剛出生的小寶寶"
              value={petName} onChange={e=>setPName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&next()} maxLength={8}/>
          </div>
        </>}

        {step===4&&<>
          <div style={{fontSize:21,fontWeight:900,color:C.brown,textAlign:"center",marginBottom:4}}>家庭會議 📋</div>
          <div style={{fontSize:12,color:C.brown,fontWeight:900,textAlign:"center",lineHeight:1.7,marginBottom:8}}>
            每個家庭，都有自己的小約定。<br/>今天一起討論一下吧。
          </div>
          <div style={{fontSize:10,color:C.soft,fontWeight:800,textAlign:"center",marginBottom:10}}>每日星星上限 100 顆，可依孩子狀況慢慢調整。</div>
          <div style={{...bub(totalPts>100?"#FFD0D0":totalPts===100?C.green:C.yellow,16),
            padding:"7px 14px",textAlign:"center",marginBottom:10,border:"none",opacity:.82}}>
            <span style={{fontSize:12,fontWeight:900,color:C.brown}}>
              目前設定：{totalPts}/100 顆星星 {totalPts>100?"⚠️ 超過了！":""}
            </span>
          </div>
          <div style={{...bub(C.cream,18),padding:"10px 12px",border:"none",marginBottom:10}}>
            <div style={{fontSize:10,color:C.soft,fontWeight:900,marginBottom:7}}>小約定完成模式</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[["approval","💛 陪伴模式","家長陪伴確認後發星星"],["trust","🌱 信任模式","孩子打勾後立刻發星星"]].map(([k,l,sub])=>(
                <button key={k} className="btn" onClick={()=>setApprovalMode(k)}
                  style={{...bub(approvalMode===k?C.yellow:C.card,16),padding:"9px 8px",border:"none",
                    outline:approvalMode===k?"3px solid "+C.butter:"none",textAlign:"left"}}>
                  <div style={{fontSize:11,fontWeight:900,color:C.brown,marginBottom:2}}>{l}</div>
                  <div style={{fontSize:9,fontWeight:800,color:C.soft,lineHeight:1.35}}>{sub}</div>
                </button>
              ))}
            </div>
          </div>
          <div style={{maxHeight:240,overflowY:"auto",marginBottom:10}}>
            {tasks.map(t=>(
              <div key={t.id} style={{marginBottom:7}}>
                {editIdx===t.id
                  ?<div style={{...bub(C.yellow,18),padding:"10px 12px",border:"none"}}>
                    <div style={{display:"flex",gap:6,marginBottom:8,alignItems:"center"}}>
                      <input style={{...bub(C.card,12),padding:"6px 8px",width:42,fontSize:18,
                        textAlign:"center",border:"none",fontWeight:900,color:C.brown}}
                        value={editIcon} onChange={e=>setEditIcon(e.target.value)} maxLength={2}/>
                      <input style={{...bub(C.card,12),flex:1,padding:"6px 10px",fontSize:12,
                        fontWeight:800,color:C.brown,border:"none"}}
                        value={editLabel} onChange={e=>setEditLabel(e.target.value)} maxLength={16}/>

            <div style={{display:"flex",alignItems:"center",gap:8}}>

                onKeyDown={e=>e.key==="Enter"&&next()} maxLength={6} autoFocus={i===0}/>
            </div>))}
        </>}

        {err&&<div style={{color:"#d04040",fontSize:12,fontWeight:800,textAlign:"center",margin:"6px 0"}}>{err}</div>}

            <span> with no button styling/hit area, hard to tap on mobile. Now a proper
            full-width button row alongside "下一步", so users who pick the wrong pet

            {step<5?"下一步 →":"🎉 開始冒險！"}
          </button>
        </div>}
      </div>
    </div>);
}

function EventApproveControl({eventId,mission,setOfficialEventProgress}){
  const [qty,setQty]=useState(1);
  return <div style={{marginTop:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}>
    <div style={{display:"flex",alignItems:"center",gap:6}}>
      <button className="btn" onClick={()=>setQty(q=>Math.max(1,q-1))}
        style={{...bub(C.light,999),width:30,height:30,fontSize:16,fontWeight:900,color:C.brown,border:"none"}}>−</button>
      <div style={{...bub(C.card,12),minWidth:42,textAlign:"center",padding:"6px 8px",fontSize:14,fontWeight:900,color:C.brown,border:"none"}}>{qty}</div>
      <button className="btn" onClick={()=>setQty(q=>Math.min(20,q+1))}
        style={{...bub(C.light,999),width:30,height:30,fontSize:16,fontWeight:900,color:C.brown,border:"none"}}>＋</button>
    </div>
    <button className="btn" onClick={()=>{
      setOfficialEventProgress(all=>{
        const current={...(all[eventId]||{})};
        const old=current[mission.id]||{count:0,pending:false};
        current[mission.id]={...old,count:Math.min(mission.target,(old.count||0)+qty),pending:false,approvedToday:true};
        return {...all,[eventId]:current};
      });
      trackSafe("official_event_approve",{eventId,missionId:mission.id,qty});
    }} style={{...bub(C.orange,999),padding:"7px 13px",fontSize:11,fontWeight:900,color:"#fff",border:"none"}}>
      確認 +{qty}
    </button>
  </div>;
}

/* ═══════════════ LITTLE OWNER CLOSET PAGE ═══════════════ */
/* Updated by Claude on 2026/06/23
   Reason: Rebuilt the closet body per requirement #2 (紙娃娃式整套預覽). The old
   per-slot (上衣/褲子/鞋襪/髮型/配件) tab+grid picker is removed here because
   KID_ITEMS is now empty (clothing was fully de-listed from the shop this round,
   see SHOP MODAL comment) -- with no items, every tab rendered nothing but an
   empty "已擁有" base option and a dead-end "去商店收藏" card, which read as
   broken rather than intentional. This is replaced with a clean "整套造型包準備
   中" placeholder card. The large preview pane on the left is UNCHANGED (still
   ActiveKid → now showing the real PNG owner automatically) and is exactly the
   hook point for whole-outfit PNG packs later: each future pack becomes one
   selectable card in a row, tapping one re-points ActiveKid/OwnerImg at that
   pack's image instead of the base PNG. closetTab/setClosetTab/equipped/
   setEquipped/owned/equip/openShop props are all still accepted (zero call-site
   changes needed) but unused below until that content exists -- intentionally
   inert, not deleted, so wiring in real packs later is a small diff. */
function ClosetPage({profile,points,isTablet,closetTab,setClosetTab,equipped,setEquipped,owned,equip,openShop,setTab}){
  // Updated by Claude on 2026/06/23 / Reason: Rewrite for gender-based outfits and outfit detail page
  const playerGender=profile.gender||"girl";
  const OUTFITS=(playerGender==="boy"?OUTFIT_CLOTHES_BOY:OUTFIT_CLOTHES_GIRL)
    .filter(o=>!o.giftOnly||owned.indexOf(o.id)>=0);
  const isPurchased=o=>owned.indexOf(o.id)>=0;

  /* Updated by Claude on 2026/06/24
     Reason: shared thumbnail renderer for both the closet grid and the detail
     page. Looks for a real asset at owner_<gender>_<outfitId> first — once art
     ships under that name it appears automatically, no further code changes.
     Until then, shows an on-brand "尚未上架" placeholder (soft Morandi tone +
     hanger icon) instead of a bare "?", so the empty state still looks designed
     rather than broken. */
  const OutfitThumb=({outfit,height,iconSize})=>{
    const key="owner_"+playerGender+"_"+outfit.id;
    const realArt=IMG[key];
    if(realArt)return <img src={realArt} onError={handleImgError} alt={outfit.label} draggable={false} style={{
      width:"100%",height,objectFit:"contain",userSelect:"none",pointerEvents:"none"}}/>;
    return <div style={{width:"100%",height,borderRadius:10,background:"linear-gradient(135deg,#F3ECE2,#E9DECF)",
      display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4}}>
      <span style={{fontSize:iconSize,opacity:.55}}>👚</span>
      <span style={{fontSize:9,fontWeight:800,color:"#A8957C"}}>尚未上架</span>
    </div>;
  };

  // 若closetTab是某個outfit id，則顯示「穿衣褢」頁面（大圖預覽）
  if(closetTab&&closetTab.startsWith("detail_")){
    const outfitId=closetTab.substring(7);
    const outfit=OUTFITS.find(o=>o.id===outfitId);
    if(!outfit)return null;
    const p=isPurchased(outfit);
    
    return <div style={{padding:isTablet?"18px 22px 24px":"14px 14px 20px",maxWidth:480,margin:"0 auto"}}>
      <button className="btn" onClick={()=>setClosetTab(null)} style={{background:"none",border:"none",fontSize:14,fontWeight:900,color:C.soft,marginBottom:16,cursor:"pointer"}}>← 回衣櫃</button>
      <div style={{...cardS(C.light),padding:isTablet?"18px 14px":"14px 12px",marginBottom:14,textAlign:"center"}}>
        <div style={{opacity:p?1:.7,marginBottom:12}}>
          <OutfitThumb outfit={outfit} height={isTablet?300:240} iconSize={isTablet?56:44}/>
        </div>
        <div style={{fontSize:isTablet?18:16,fontWeight:900,color:C.brown,marginBottom:4}}>{outfit.label}</div>
        {!p&&!outfit.locked&&<div style={{fontSize:12,color:C.soft,fontWeight:800,marginBottom:12}}>⭐{outfit.price}</div>}
        {p?
          <button className="btn" onClick={()=>equip(outfit)} style={{...bub(equipped.outfit===outfit.id?C.light:C.orange),borderRadius:999,padding:equipped.outfit===outfit.id?"8px 20px":"12px 20px",fontSize:equipped.outfit===outfit.id?12:15,fontWeight:900,color:equipped.outfit===outfit.id?C.soft:"#fff",border:"none",width:"100%",boxShadow:equipped.outfit===outfit.id?"none":"0 5px 0 rgba(180,80,0,.25)"}}>
            {equipped.outfit===outfit.id?"✓ 正在穿著":"✨ 穿上"}
          </button>
          :outfit.locked?
          <div style={{...bub(C.light),borderRadius:16,padding:"10px 14px",fontSize:12,fontWeight:900,color:C.soft,width:"100%"}}>
            🎁 即將上架，等待 Founder 提供素材
          </div>
          :<button className="btn" onClick={()=>openShop()} style={{...bub(C.orange),borderRadius:999,padding:"8px 20px",fontSize:12,fontWeight:900,color:"#fff",border:"none",width:"100%"}}>
            購買 ⭐{outfit.price}
          </button>
        }
      </div>
    </div>;
  }
  
  // 衣櫃列表頁面
  return <div style={{padding:isTablet?"18px 22px 24px":"14px 14px 20px",maxWidth:480,margin:"0 auto"}}>
    <div style={{fontSize:isTablet?20:18,fontWeight:900,color:C.brown,marginBottom:16}}>🪞 衣櫃</div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
      {OUTFITS.map(o=>{const p=isPurchased(o);return <button key={o.id} className="btn" onClick={()=>setClosetTab("detail_"+o.id)} style={{
        ...cardS(p?C.light:"#F5F5F5"),borderRadius:12,padding:12,display:"flex",flexDirection:"column",alignItems:"center",
        gap:4,minHeight:140,border:"2px solid "+(p?C.butter:"#DDD"),opacity:p?1:0.62,cursor:"pointer"}}>
        <OutfitThumb outfit={o} height={100} iconSize={28}/>
        <div style={{fontSize:10,fontWeight:900,color:p?C.brown:"#999"}}>{o.label}</div>
        {!p&&!o.locked&&<div style={{fontSize:8,color:"#999"}}>⭐{o.price}</div>}
        {!p&&o.locked&&<div style={{fontSize:8,color:"#A8957C",fontWeight:900}}>🎁即將上架</div>}
      </button>;})}
    </div>
  </div>;
}

function FamilyRoot(){
  const initialFamily=readFamily();
  const legacySave=readPlayerSave("habitKingdom"),hasLegacy=!initialFamily&&!!legacySave.profile;
  const [family,setFamily]=useState(initialFamily);
  const [view,setView]=useState(initialFamily?"home":hasLegacy?"migrate":"setup");
  const [activeId,setActiveId]=useState(null);

  const commitFamily=(next)=>{setFamily(next);saveFamily(next);};
  const createFirst=({familyName,playerName,themeId})=>{
    const id=makePlayerId(),storageKey="habitKingdom_player_"+id,now=new Date().toISOString();
    if(hasLegacy){
      const copied={...legacySave,profile:{...legacySave.profile,kidName:playerName}};
      localStorage.setItem(storageKey,JSON.stringify(copied));
      ["lastLogin_hk","lastStreak_hk","musicOn_hk","weather_hk","parkPetPan_hk","parkKidPan_hk"].forEach(k=>{
        const value=localStorage.getItem(k);if(value!==null)localStorage.setItem(k+"_"+id,value);
      });
    }
    const next={version:1,familyName,familyCreatedAt:now,activePlayerId:id,players:[{id,name:playerName,themeId,storageKey,createdAt:now,
      localSaveId:makeLocalSaveId(),futureGoogleUserId:"",loginStatus:"local",cloudSaveStatus:"not_connected"}]};
    commitFamily(next);setActiveId(id);setView("game");
  };
  const addPlayer=({playerName,themeId})=>{
    if(!family||family.players.length>=3)return;
    const id=makePlayerId(),now=new Date().toISOString(),player={id,name:playerName,themeId,storageKey:"habitKingdom_player_"+id,createdAt:now,
      localSaveId:makeLocalSaveId(),futureGoogleUserId:"",loginStatus:"local",cloudSaveStatus:"not_connected"};
    const next={...family,activePlayerId:id,players:[...family.players,player]};commitFamily(next);setActiveId(id);setView("game");
  };
  const selectPlayer=(p)=>{const next={...family,activePlayerId:p.id};commitFamily(next);setActiveId(p.id);setView("game");};
  const updatePlayerName=(id,name)=>{if(!name||!family)return;const next={...family,players:family.players.map(p=>p.id===id?{...p,name}:p)};commitFamily(next);};
  const editFamilyName=()=>{const name=window.prompt("家庭名稱",family.familyName||"我的家庭");if(name&&name.trim())commitFamily({...family,familyName:name.trim()});};

  if(view==="migrate")return <FamilySetup legacy={legacySave} onDone={createFirst}/>;
  if(view==="setup")return <FamilySetup onDone={createFirst}/>;
  if(view==="add")return <FamilySetup addMode defaultName="" onDone={({playerName,themeId})=>addPlayer({playerName,themeId})} onCancel={()=>setView(family.players.length>1?"select":"home")}/>;
  if(view==="home")return <FamilyHome family={family} onEnter={()=>family.players.length===1?selectPlayer(family.players[0]):setView("select")}
    onAdd={()=>setView("add")} onEditName={editFamilyName}/>;
  if(view==="select")return <PlayerSelect family={family} onSelect={selectPlayer} onBack={()=>setView("home")} onAdd={()=>setView("add")}/>;
  const active=family.players.find(p=>p.id===activeId)||family.players.find(p=>p.id===family.activePlayerId)||family.players[0];
  return <App key={active.id} storageKey={active.storageKey} playerId={active.id} playerName={active.name} themeId={active.themeId}
    onProfileChange={name=>updatePlayerName(active.id,name)} onSwitch={()=>setView(family.players.length>1?"select":"home")}/>;
}

  // wish form

  const roomDecorDragRef=useRef(null);
  const roomDecorClickGuardRef=useRef(false);
  const googleButtonRef=useRef(null);
  const cloudDirtyReadyRef=useRef(false);
  const getPlayerMeta=()=>{const fam=readFamily();return fam&&Array.isArray(fam.players)?fam.players.find(p=>p.id===playerId):null;};
  const initialPlayerMeta=getPlayerMeta()||{};
  const localSaveId=initialPlayerMeta.localSaveId||("local_"+(playerId||"solo"));
  const [googleBinding,setGoogleBinding]=useState(()=>safeParseJSON(localStorage.getItem(googleBindingKey(localSaveId)),null));
  const [googleLoadState,setGoogleLoadState]=useState("idle");
  const [googleError,setGoogleError]=useState("");
  const [authUiState,setAuthUiState]=useState(()=>({status:"unknown",sessionPresent:false,authStoreReady:false,parentPanelSubscribed:false,lastAuthEvent:""}));
  const googleConnected=!!googleBinding||authUiState.status==="signed_in"||authUiState.sessionPresent;
  const updateGoogleFamilyMeta=(patch)=>{
    const fam=readFamily();
    if(!fam||!Array.isArray(fam.players))return;
    const next={...fam,players:fam.players.map(p=>p.id===playerId?{...p,...patch}:p)};
    saveFamily(next);
  };
  const bindGoogleLocalSave=(payload)=>{
    if(!payload||!payload.sub)throw new Error("Google credential missing sub");
    const binding={
      sub:payload.sub,
      name:payload.name||"",
      localSaveId,
      boundAt:new Date().toISOString(),
      cloudSaveStatus:"local_only"
    };
    localStorage.setItem(googleBindingKey(localSaveId),JSON.stringify(binding));
    setGoogleBinding(binding);
    updateGoogleFamilyMeta({futureGoogleUserId:payload.sub,loginStatus:"google_connected",cloudSaveStatus:"local_only",localSaveId});
    trackSafe("google_login_success",{result:"success"});
    trackSafe("google_local_save_bound",{result:"bound"});
    toast2("已登入 Google，並綁定本機資料（尚未雲端同步）",C.yellow);
    return binding;
  };
  const syncGoogleAuthUi=(authStatus)=>{
    if(!authStatus)return;
    setAuthUiState({
      status:authStatus.status||"unknown",
      sessionPresent:!!authStatus.sessionPresent,
      authStoreReady:true,
      parentPanelSubscribed:true,
      lastAuthEvent:authStatus.lastAuthEvent||""
    });
    if(authStatus.status==="signed_in"){
      const payload=window.PetHabitPlatform&&window.PetHabitPlatform.getSupabaseAuthBindingPayload?window.PetHabitPlatform.getSupabaseAuthBindingPayload():null;
      const existing=safeParseJSON(localStorage.getItem(googleBindingKey(localSaveId)),null);
      if(payload&&payload.sub&&!existing)bindGoogleLocalSave(payload);
      else if(existing)setGoogleBinding(existing);
      setGoogleLoadState("ready");
      setGoogleError("");
      setTimeout(()=>triggerCloudInitialCheck(),0);
    }else if(authStatus.status==="signed_out"||authStatus.status==="session_expired"||authStatus.status==="local_only"){
      setGoogleBinding(null);
      if(authStatus.status==="signed_out")localStorage.removeItem(googleBindingKey(localSaveId));
      setCloudSaveState(s=>({...s,status:"not_signed_in"}));
    }
  };
  // Deprecated legacy GIS binding is kept only as a local migration reference.
  // Formal V1.1 login must go through SupabaseAuthManager.signInWithGoogle().
  const handleGoogleCredential=(response)=>{
    try{
      const payload=decodeGoogleCredential(response&&response.credential||"");
      bindGoogleLocalSave(payload);
      setGoogleError("");
    }catch(e){
      const msg=String(e&&e.message||e);
      setGoogleError(msg);
      trackSafe("google_login_fail",{reason:msg});
      toast2("Google 登入暫時失敗，遊戲仍可正常使用",C.peach);
    }
  };
  const openGoogleLogin=()=>{
    trackSafe("google_login_click",{entry:"parent_backup"});
    setModal("googleLogin");
  };
  const startSupabaseGoogleLogin=()=>{
    setGoogleLoadState("loading");
    setGoogleError("");
    trackSafe("google_login_click",{entry:"parent_backup"});
    if(!(window.PetHabitPlatform&&window.PetHabitPlatform.signInWithSupabaseGoogle)){
      const msg="Google 登入尚未準備完成，請重新整理後再試一次。遊戲資料仍安全保存在這台裝置。";
      setGoogleLoadState("error");setGoogleError(msg);toast2(msg,C.peach);return;
    }
    window.PetHabitPlatform.signInWithSupabaseGoogle().then(res=>{
      refreshSyncDebug();
      if(res&&res.ok){setGoogleLoadState("ready");toast2("正在前往 Google 登入，本機資料不會被刪除",C.yellow);}
      else{
        const raw=res&&res.error&&res.error.message||"auth_unavailable";
        const msg=DEVELOPER_MODE?raw:"Google 登入尚未準備完成，請重新整理後再試一次。遊戲資料仍安全保存在這台裝置。";
        setGoogleLoadState("error");setGoogleError(raw);toast2(msg,C.peach);
        trackSafe("google_login_fail",{reason:res&&res.error&&res.error.code||"auth_unavailable"});
      }
    });
  };
  const googleLogout=()=>{
    localStorage.removeItem(googleBindingKey(localSaveId));
    setGoogleBinding(null);
    setAuthUiState(s=>({...s,status:"signed_out",sessionPresent:false,lastAuthEvent:"SIGNED_OUT",authStoreReady:true}));
    updateGoogleFamilyMeta({loginStatus:"local",cloudSaveStatus:"not_connected"});
    if(window.PetHabitPlatform&&window.PetHabitPlatform.signOutSupabase){
      window.PetHabitPlatform.signOutSupabase().then(()=>{refreshSyncDebug();}).catch(()=>{});
    }else{
      trackSafe("google_logout",{result:"local_data_kept"});
    }
    toast2("已登出 Google，本機遊戲資料仍保留",C.yellow);
  };
  const hintKey=(hintId,suffix)=>"petHabitHint_"+(playerId||"solo")+"_"+hintId+"_"+suffix;
  const showCoachHint=(hintId,message)=>{
    if(coachHint)return;
    if(localStorage.getItem(hintKey(hintId,"seen"))==="true")return;
    const attempts=Number(localStorage.getItem(hintKey(hintId,"attempts"))||"0");
    if(attempts>=2)return;
    localStorage.setItem(hintKey(hintId,"attempts"),String(attempts+1));
    setCoachHint({hintId,message});
    setTimeout(()=>setCoachHint(h=>h&&h.hintId===hintId?null:h),4200);
  };
  const acknowledgeCoachHint=()=>{
    if(coachHint)localStorage.setItem(hintKey(coachHint.hintId,"seen"),"true");
    setCoachHint(null);
  };
  const showJit=(topic,force=false)=>{
    if(!JIT_TUTORIALS[topic])return;
    const key=playerStorageKey("jit_v"+TUTORIAL_VERSION+"_"+topic+"_seen");
    const attemptKey=playerStorageKey("jit_v"+TUTORIAL_VERSION+"_"+topic+"_attempts");
    const attempts=Number(localStorage.getItem(attemptKey)||"0");
    if(force||localStorage.getItem(key)!=="true"&&attempts<2){
      if(!force)localStorage.setItem(attemptKey,String(attempts+1));
      setHelpTopicForce(force);
      setHelpTopic(topic);
    }
  };
  const acknowledgeJit=()=>{
    if(helpTopic&&helpTopic!=="index")localStorage.setItem(playerStorageKey("jit_v"+TUTORIAL_VERSION+"_"+helpTopic+"_seen"),"true");
    setHelpTopic(null);
    setHelpTopicForce(false);
  };
  const refreshSyncDebug=()=>{if(window.PetHabitPlatform&&window.PetHabitPlatform.getSyncDebugState)setSyncDebug(window.PetHabitPlatform.getSyncDebugState());};
  const refreshCloudSaveState=()=>{
    if(window.PetHabitPlatform&&window.PetHabitPlatform.getCloudSaveStatus)setCloudSaveState(window.PetHabitPlatform.getCloudSaveStatus());
  };
  const triggerCloudInitialCheck=()=>{
    if(!(window.PetHabitPlatform&&window.PetHabitPlatform.initialCloudSaveCheck))return;
    window.PetHabitPlatform.initialCloudSaveCheck().then(res=>{
      refreshCloudSaveState();
      refreshSyncDebug();
      if(res&&res.ok&&res.data&&res.data.status==="needs_initial_backup")toast2("已登入 Google，可以先建立第一份雲端備份 ☁️",C.yellow);
      if(res&&res.ok&&res.data&&res.data.status==="cloud_available")toast2("偵測到雲端已有存檔，請到資料備份選擇使用哪一份。",C.yellow);
    }).catch(()=>refreshCloudSaveState());
  };
  const runCloudInitialCheck=()=>{
    if(!(window.PetHabitPlatform&&window.PetHabitPlatform.initialCloudSaveCheck)){toast2("雲端備份尚未準備好",C.peach);return;}
    window.PetHabitPlatform.initialCloudSaveCheck().then(res=>{
      refreshCloudSaveState();refreshSyncDebug();
      toast2(res&&res.ok?"雲端狀態檢查完成":"雲端狀態檢查失敗，本機資料仍保留",res&&res.ok?C.green:C.peach);
    });
  };
  const runManualCloudBackup=()=>{
    if(!(window.PetHabitPlatform&&window.PetHabitPlatform.manualCloudBackup)){toast2("雲端備份尚未準備好",C.peach);return;}
    window.PetHabitPlatform.manualCloudBackup().then(res=>{
      refreshCloudSaveState();refreshSyncDebug();
      toast2(res&&res.ok?"已完成雲端備份 ☁️":"雲端備份失敗，本機資料仍保留",res&&res.ok?C.green:C.peach);
    });
  };
  const runCloudRestore=()=>{
    if(!(window.PetHabitPlatform&&window.PetHabitPlatform.restoreCloudSave)){toast2("雲端還原尚未準備好",C.peach);return;}
    if(!confirm("從雲端還原會覆蓋目前這台裝置的遊戲資料。系統會先建立本機快照，確定要繼續嗎？"))return;
    window.PetHabitPlatform.restoreCloudSave().then(res=>{
      refreshCloudSaveState();refreshSyncDebug();
      if(res&&res.ok){toast2("已從雲端還原，畫面將重新整理",C.green);setTimeout(()=>location.reload(),700);}
      else toast2("雲端還原失敗，本機資料未被清除",C.peach);
    });
  };
  const resolveCloudConflict=(choice)=>{
    if(!(window.PetHabitPlatform&&window.PetHabitPlatform.resolveCloudSaveConflict)){toast2("雲端備份尚未準備好",C.peach);return;}
    window.PetHabitPlatform.resolveCloudSaveConflict(choice).then(res=>{
      refreshCloudSaveState();refreshSyncDebug();
      if(res&&res.ok&&choice==="cloud"){toast2("已選擇雲端資料，畫面將重新整理",C.green);setTimeout(()=>location.reload(),700);}
      else toast2(res&&res.ok?"已選擇本機資料並建立雲端備份":"處理失敗，本機資料仍保留",res&&res.ok?C.green:C.peach);
    });
  };

    const maxX=Math.max(0,rect.width-(drag.width||0));
    const maxY=Math.max(0,rect.height-(drag.height||0));
    const x=Math.max(0,Math.min(maxX,xPx))/rect.width*100;
    const y=Math.max(0,Math.min(maxY,yPx))/rect.height*100;
    const slotId=roomDecorDragRef.current.slotId;
    const itemId=drag.itemId;
    drag.moved=true;
