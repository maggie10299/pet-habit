*{box-sizing:border-box;margin:0;padding:0;}
:root{--theme-main:#F5A623;--theme-mid:#FFD97D;--theme-soft:#FFE566;--theme-border:rgba(255,215,140,.22);--theme-dark:#4A3000;}
html,body{height:100%;overscroll-behavior:none;}
body{
  background-color:#FFFBF0;
  background-image:radial-gradient(circle,#FFE56638 1.2px,transparent 1.2px);
  background-size:22px 22px;
  font-family:'Nunito',sans-serif;
}
#root{max-width:768px;margin:0 auto;min-height:100vh;position:relative;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes bIn{0%{transform:scale(.5);opacity:0}65%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes hUp{0%{transform:scale(0) translateY(0);opacity:1}100%{transform:scale(1.6) translateY(-60px);opacity:0}}
@keyframes legR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(18deg)}}
@keyframes mnch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.8)}}
@keyframes spkl{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.3)}}
@keyframes cDrift{from{transform:translateX(-150px)}to{transform:translateX(110vw)}}
@keyframes gWave{0%,100%{transform-origin:bottom;transform:rotate(-5deg)}50%{transform-origin:bottom;transform:rotate(5deg)}}
@keyframes starPop{0%{transform:scale(0) rotate(-20deg);opacity:0}70%{transform:scale(1.15) rotate(5deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes kidBlink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
.kid-eye{transform-box:fill-box;transform-origin:center;animation:kidBlink 4.8s infinite;}
@keyframes ponyBlink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.08)}}
@keyframes ponyEar{0%,82%,100%{transform:rotate(0)}88%{transform:rotate(-9deg)}93%{transform:rotate(7deg)}}
@keyframes ponyTail{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes ponyBreathe{0%,100%{transform:scaleY(1) translateY(0)}50%{transform:scaleY(.975) translateY(2px)}}
@keyframes ponyDash{0%,100%{transform:translateY(0) rotate(0)}30%{transform:translateY(-5px) rotate(-2deg)}65%{transform:translateY(1px) rotate(2deg)}}
.pony-eye{transform-box:fill-box;transform-origin:center;animation:ponyBlink 4.2s infinite;}
.pony-ear{transform-box:fill-box;transform-origin:bottom center;animation:ponyEar 5s infinite;}
.pony-tail{transform-box:fill-box;transform-origin:right center;animation:ponyTail 1.8s ease-in-out infinite;}
.pony-breathe{transform-box:fill-box;transform-origin:center bottom;animation:ponyBreathe 2.8s ease-in-out infinite;}
.pony-dash{transform-box:fill-box;transform-origin:center bottom;animation:ponyDash .45s ease-in-out infinite;}
@keyframes cuteBlink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.08)}}
@keyframes cuteWiggle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes petSleep{0%,100%{transform:translateY(7px) rotate(-3deg) scaleY(.92)}50%{transform:translateY(9px) rotate(-3deg) scaleY(.88)}}
@keyframes petYawn{0%,100%{transform:scale(1)}45%,70%{transform:scaleY(.9) scaleX(1.04)}}
@keyframes petLook{0%,100%{transform:rotate(0)}35%,70%{transform:rotate(-7deg)}}
@keyframes petSit{0%,100%{transform:translateY(4px)}50%{transform:translateY(1px)}}
@keyframes petHug{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(-9px) rotate(-5deg)}}
.cute-eye{transform-box:fill-box;transform-origin:center;animation:cuteBlink 4.6s infinite;}
.cute-wiggle{transform-box:fill-box;transform-origin:center bottom;animation:cuteWiggle 1.9s ease-in-out infinite;}
.pet-action-sleep{animation:petSleep 2.4s ease-in-out infinite;transform-origin:center bottom;}
.pet-action-yawn{animation:petYawn 1.2s ease-in-out infinite;transform-origin:center bottom;}
.pet-action-window{animation:petLook 2.3s ease-in-out infinite;transform-origin:center bottom;}
.pet-action-sofa,.pet-action-read,.pet-action-paint,.pet-action-guitar,.pet-action-water{animation:petSit 1.7s ease-in-out infinite;transform-origin:center bottom;}
.pet-action-hug{animation:petHug 1s ease-in-out infinite;transform-origin:center bottom;}
.btn{cursor:pointer;border:none;font-family:'Nunito',sans-serif;font-weight:900;
  transition:transform .12s,box-shadow .12s;user-select:none;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.91) translateY(2px)!important;box-shadow:0 2px 0 rgba(0,0,0,.08)!important;}
input,textarea{font-family:'Nunito',sans-serif;outline:none;border:none;background:transparent;}

  key==="musicOn_hk"||key==="weather_hk"||key==="parkPetPan_hk"||key==="parkKidPan_hk"||key===FAMILY_KEY||
  key.startsWith("habitKingdom_player_")||key.startsWith("lastLogin_hk_")||key.startsWith("lastStreak_hk_")||
  key.startsWith("musicOn_hk_")||key.startsWith("weather_hk_")||key.startsWith("parkPetPan_hk_")||key.startsWith("parkKidPan_hk_");

const readPlayerSave=(storageKey)=>{try{return JSON.parse(localStorage.getItem(storageKey)||"{}");}catch(e){return {};}};
const makePlayerId=()=>"p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const familyDay=(createdAt)=>Math.max(1,Math.floor((Date.now()-new Date(createdAt||Date.now()).getTime())/86400000)+1);

/* ═══════════════ AUDIO SYSTEM ═══════════════ */
function createAudio(){
  let ctx=null,musicNodes=[],musicOn=true;
  const getCtx=()=>{
    if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    return ctx;
  };
  const beep=(freq,dur,vol,type)=>{
    try{
      const c=getCtx(),o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type=type||"sine";o.frequency.setValueAtTime(freq,c.currentTime);
      g.gain.setValueAtTime(vol||0.3,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.start(c.currentTime);o.stop(c.currentTime+dur);
    }catch(e){}
  };
  const playChord=(freqs,dur,vol)=>{freqs.forEach(f=>beep(f,dur,vol||0.15));};

  return{
    check:()=>{
      // happy ascending ding
      beep(523,.1,.3);
      setTimeout(()=>beep(659,.1,.3),80);
      setTimeout(()=>beep(784,.15,.35),160);
    },
    approve:()=>{
      // triumphant chord
      playChord([523,659,784],.4,.2);
      setTimeout(()=>playChord([659,784,1047],.5,.18),200);
    },
    feed:()=>{
      // cute nom nom
      beep(392,.08,.2,"triangle");
      setTimeout(()=>beep(440,.08,.2,"triangle"),120);
      setTimeout(()=>beep(392,.08,.2,"triangle"),240);
    },
    pat:()=>{
      // sparkle sound
      beep(880,.08,.15,"sine");
      setTimeout(()=>beep(1047,.08,.15),60);
      setTimeout(()=>beep(1319,.12,.15),120);
    },
    achieve:()=>{
      // fanfare
      const notes=[523,659,784,1047];
      notes.forEach((f,i)=>setTimeout(()=>beep(f,.2,.25),i*100));
      setTimeout(()=>playChord([659,784,1047],.6,.2),450);
    },
    login:()=>{
      // gentle morning chime
      beep(528,.15,.2,"sine");
      setTimeout(()=>beep(660,.15,.2),150);
      setTimeout(()=>beep(792,.2,.2),300);
    },
    weekend:()=>{
      // celebration
      playChord([523,659],.15,.2);
      setTimeout(()=>playChord([659,784],.15,.2),200);
      setTimeout(()=>playChord([784,1047],.3,.2),400);
    },
    clean:()=>{
      // whoosh clean
      beep(300,.05,.15,"sawtooth");
      setTimeout(()=>beep(600,.1,.15,"sine"),80);
      setTimeout(()=>beep(900,.15,.15,"sine"),160);
    },
    buy:()=>{
      beep(440,.08,.2);
      setTimeout(()=>beep(550,.08,.2),100);
      setTimeout(()=>beep(660,.12,.2),200);
    },
    bath:()=>{
      // splashing sound
      beep(400,.06,.15,"triangle");
      setTimeout(()=>beep(500,.06,.15,"triangle"),80);
      setTimeout(()=>beep(450,.06,.15,"triangle"),160);
      setTimeout(()=>beep(520,.1,.15,"triangle"),240);
    },
    flower:()=>{
      beep(659,.1,.2,"sine");
      setTimeout(()=>beep(784,.1,.2),100);
      setTimeout(()=>beep(1047,.15,.2),200);
    },
    ball:()=>{
      beep(300,.05,.2,"triangle");
      setTimeout(()=>beep(200,.1,.15,"triangle"),100);
    },
    startMusic:(onOff)=>{
      musicOn=onOff;
      if(!onOff){musicNodes.forEach(n=>{try{n.stop();}catch(e){}});musicNodes=[];return;}
      try{
        const c=getCtx();
        const timers=[];
        const pNote=(freq,st,dur,vol,type)=>{
          const o=c.createOscillator(),g=c.createGain();
          o.connect(g);g.connect(c.destination);
          o.type=type||"triangle";
          o.frequency.setValueAtTime(freq,st);
          g.gain.setValueAtTime(0,st);
          g.gain.linearRampToValueAtTime(vol,st+0.025);
          g.gain.exponentialRampToValueAtTime(vol*0.2,st+dur*0.65);
          g.gain.exponentialRampToValueAtTime(0.001,st+dur*1.3);
          o.start(st);o.stop(st+dur*1.4);
          musicNodes.push(o);
        };
        // 卡農和弦 C-G-Am-Em-F-C-F-G
        const bassSeq=[261,196,220,164,174,261,174,196];
        const beatLen=2.0;
        // 卡農主旋律
        const canonTheme=[
          {f:523,d:.5},{f:493,d:.5},{f:440,d:.5},{f:392,d:.5},
          {f:349,d:.5},{f:392,d:.5},{f:440,d:.5},{f:349,d:.5},
          {f:329,d:.5},{f:349,d:.5},{f:392,d:.5},{f:329,d:.5},
          {f:293,d:.5},{f:329,d:.5},{f:349,d:.5},{f:293,d:.5},
        ];
        // 動森五聲音階點綴
        const acPenta=[523,587,659,784,880,1047];
        const acMelody=[2,4,5,4,2,0,2,4,5,2,4,5];
        let loopT=c.currentTime+0.5;
        const playLoop=()=>{
          if(!musicOn)return;
          // 低音和弦
          bassSeq.forEach((freq,i)=>{
            pNote(freq,loopT+i*beatLen,beatLen*0.85,0.020,"sine");
            pNote(freq*1.5,loopT+i*beatLen+0.4,beatLen*0.5,0.010,"sine");
          });
          // 卡農主旋律第一聲部
          let off=0;
          canonTheme.forEach(n=>{pNote(n.f,loopT+off,n.d,0.032,"triangle");off+=n.d;});
          // 卡農第二聲部（延遲2拍，低八度）
          off=0;
          canonTheme.forEach(n=>{pNote(n.f*0.5,loopT+beatLen*2+off,n.d,0.016,"sine");off+=n.d;});
          // 動森點綴（第4拍後輕輕飄入）
          let acOff=beatLen*3.5;
          acMelody.forEach((idx,i)=>{
            pNote(acPenta[idx],loopT+acOff+i*0.52,0.48,0.020,"triangle");
          });
          const totalDur=bassSeq.length*beatLen;
          loopT+=totalDur+1.2;
          const tid=setTimeout(playLoop,(totalDur+0.8)*1000);
          timers.push(tid);
        };
        playLoop();
      }catch(e){}
    },
    setMusicOn:(v)=>{musicOn=v;},
    stopMusic:()=>{musicNodes.forEach(n=>{try{n.stop();}catch(e){}});musicNodes=[];}
  };
}
const Audio=createAudio();
function StarJar({stars,max,size}){
  size=size||1;
  const pct=Math.min(100,(stars/Math.max(max,1))*100);
  const w=90*size,h=100*size;
  return(
    <svg width={w} height={h} viewBox="0 0 90 100">
      <rect x="6" y="22" width="78" height="72" rx="14" fill="#FFF8D0" stroke="#E8C840" strokeWidth="2.5"/>
      <clipPath id="jc"><rect x="8" y="24" width="74" height="68" rx="12"/></clipPath>
      <rect x="8" y={24+68*(1-pct/100)} width="74" height={68*pct/100}
        fill="#FFE566" opacity=".55" clipPath="url(#jc)"/>
      <ellipse cx="24" cy="38" rx="7" ry="12" fill="#fff" opacity=".25" clipPath="url(#jc)"/>
      {pct>8&&<text x="45" y="80" fontSize="18" textAnchor="middle">⭐</text>}
      {pct>25&&<text x="28" y="65" fontSize="14" textAnchor="middle">⭐</text>}
      {pct>45&&<text x="63" y="60" fontSize="13" textAnchor="middle">⭐</text>}
      {pct>65&&<text x="40" y="50" fontSize="11" textAnchor="middle">⭐</text>}
      <rect x="16" y="14" width="58" height="12" rx="6" fill="#E8C840"/>
      <rect x="28" y="8" width="34" height="10" rx="5" fill="#E8C840"/>
      <rect x="6" y="22" width="78" height="72" rx="14" fill="none" stroke="#E8C840" strokeWidth="2.5"/>
    </svg>);
}

/* ═══════════════ NUMPAD ═══════════════ */
function NumPad({title,subtitle,onSuccess,onClose,correctPin}){
  const [inp,setInp]=useState("");
  const [shake,setShake]=useState(false);
  const keys=["1","2","3","4","5","6","7","8","9","","0","⌫"];
  const press=(k)=>{
    if(k==="⌫"){setInp(p=>p.slice(0,-1));return;}
    if(!k) return;
    const next=inp+k;
    setInp(next);
    if(next.length===correctPin.length){
      if(next===correctPin){onSuccess();}
      else{setShake(true);setTimeout(()=>{setShake(false);setInp("");},600);}
    }
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(60,20,0,.45)",backdropFilter:"blur(8px)",
      zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
      onClick={onClose}>
      <div style={{...cardS(C.card),padding:"28px 24px",width:"100%",maxWidth:340,
        animation:"bIn .35s"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:36,textAlign:"center",marginBottom:8}}>🔐</div>
        <div style={{fontSize:18,fontWeight:900,color:C.brown,textAlign:"center",marginBottom:4}}>{title||"家長登入"}</div>
        {subtitle&&<div style={{fontSize:11,color:C.soft,fontWeight:800,textAlign:"center",marginBottom:16}}>{subtitle}</div>}
        {/* dots */}
        <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:20,
          animation:shake?"shake .4s":""}}>
          {Array.from({length:correctPin.length}).map((_,i)=>(
            <div key={i} style={{width:16,height:16,borderRadius:999,
              background:i<inp.length?C.brown:"rgba(0,0,0,.12)",
              transition:"background .15s"}}/>))}
        </div>
        {/* numpad */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {keys.map((k,i)=>(
            <button key={i} className="btn" onClick={()=>press(k)}
              style={{...bub(k&&k!=="⌫"?C.yellow:k==="⌫"?C.peach:"transparent"),
                borderRadius:16,padding:"14px 0",fontSize:20,fontWeight:900,
                color:C.brown,visibility:k?"visible":"hidden",
                border:"none"}}>
              {k}
            </button>))}
        </div>
        <button className="btn" onClick={onClose}
          style={{...bub(C.light),width:"100%",padding:"11px 0",borderRadius:999,
            fontSize:13,fontWeight:900,color:C.soft,marginTop:14,border:"none"}}>取消</button>
      </div>
    </div>);
}

  const exportBackup=()=>{
    try{
      const saved={};
      SAVE_KEYS.forEach(key=>{const value=localStorage.getItem(key);if(value!==null)saved[key]=value;});
      const payload={app:"Pet Habit Kingdom",version:1,exportedAt:new Date().toISOString(),localStorage:saved};
      const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
      const url=URL.createObjectURL(blob),a=document.createElement("a");
      a.href=url;a.download="pet-habit-backup-"+new Date().toISOString().slice(0,10)+".json";
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
      setBackupMsg("✅ 備份檔已匯出，請妥善保存");
    }catch(e){setBackupMsg("❌ 匯出失敗，請再試一次");}
  };
  const importBackup=async(e)=>{
    const file=e.target.files&&e.target.files[0];
    e.target.value="";
    if(!file)return;
    try{
      const payload=JSON.parse(await file.text());
      const saved=payload&&payload.localStorage;
      if(!saved||typeof saved!=="object"||!Object.keys(saved).some(isPetHabitSaveKey))throw new Error("invalid backup");
      if(!window.confirm("匯入會覆蓋目前資料，是否確認？"))return;
      getPetHabitSaveKeys().forEach(key=>localStorage.removeItem(key));
      Object.keys(saved).filter(isPetHabitSaveKey).forEach(key=>{if(typeof saved[key]==="string")localStorage.setItem(key,saved[key]);});
      window.location.reload();

  return <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:18,
    background:"linear-gradient(160deg,#FFF9EA,#F8F1FF,#EAF7EF)",...themeVars(themeId)}}>
    <div style={{...cardS(C.card),width:"100%",maxWidth:470,padding:"25px 20px"}}>

        <div style={{fontSize:11,fontWeight:800,color:C.soft,marginTop:5}}>{legacy?"原本的任務、星星、寵物與衣櫃都會保留":addMode?"每位小主人都有自己的任務、寵物與房間":"先建立第一位小主人，之後最多可新增至 3 位"}</div>

          style={{width:"100%",fontSize:15,fontWeight:900,color:C.brown}}/>
      </div>}
      <div style={{...bub(C.light,17),padding:"10px 13px",marginBottom:13,border:"none"}}>
        <div style={{fontSize:10,fontWeight:900,color:C.soft,marginBottom:3}}>小主人名字</div>

          color:t.dark,fontSize:10,fontWeight:900,border:"none",outline:themeId===t.id?"3px solid "+t.main:"none"}}>
          <span style={{display:"inline-block",width:17,height:17,borderRadius:999,background:t.main,verticalAlign:"middle",marginRight:4}}/>{t.name}
        </button>)}
      </div>

      <button className="btn" onClick={()=>{
        if(!playerName.trim()){setErr("請輸入小主人名字");return;}

        {legacy?"保留資料並繼續":addMode?"新增小主人":"建立小主人"}

        {family.players.map(p=>{
          const save=readPlayerSave(p.storageKey),profile=save.profile||{},eq=save.equipped||{},tasks=save.tasks||DEFAULT_TASKS,checked=save.checked||{};
          const done=tasks.filter(h=>!!checked["ok-"+today+"-"+h.id]).length,t=getTheme(p.themeId);
          return <button key={p.id} className="btn" onClick={()=>onSelect(p)} style={{...cardS(t.soft),padding:"15px 12px",textAlign:"center",
            color:t.dark,border:"3px solid "+t.border,...themeVars(p.themeId)}}>
            <div style={{height:150,display:"flex",alignItems:"flex-end",justifyContent:"center",overflow:"hidden"}}>
              <KidView gender={profile.gender||"girl"} skin={profile.skin||"#F2C7A5"} top={eq.kidTop} bottom={eq.kidBottom}
                shoes={eq.kidShoes} hat={eq.kidHat} acc={eq.kidAcc} size={.95}/>
            </div>
            <div style={{fontSize:17,fontWeight:900,marginTop:3}}>{p.name||profile.kidName||"小主人"}</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:7,margin:"8px 0"}}>
              <PetView petType={profile.petType||"horse"} level={1} mood={4} hunger={80} size={.28}/>
              <div style={{textAlign:"left",fontSize:10,fontWeight:900,color:C.soft}}>{profile.petName||"等待選擇寵物"}<br/><span style={{color:t.dark}}>{t.name}</span></div>
            </div>
            <div style={{...bub("rgba(255,255,255,.7)",999),padding:"5px 9px",fontSize:10,fontWeight:900,border:"none"}}>
              今日任務 {done}/{tasks.length}
            </div>
          </button>;
        })}
      </div>
      <div style={{display:"grid",gridTemplateColumns:family.players.length<3?"1fr 1fr":"1fr",gap:8,marginTop:15}}>
        <button className="btn" onClick={onBack} style={{...bub(C.light),padding:"12px 0",borderRadius:999,color:C.soft,fontSize:12,border:"none"}}>← 家庭首頁</button>
        {family.players.length<3&&<button className="btn" onClick={onAdd} style={{...bub(C.yellow),padding:"12px 0",borderRadius:999,color:C.brown,fontSize:12,border:"none"}}>＋ 新增小主人</button>}
      </div>
    </div>
  </div>;
}

function FamilyRoot(){
  const initialFamily=readFamily();
  const legacySave=readPlayerSave("habitKingdom"),hasLegacy=!initialFamily&&!!legacySave.profile;
  const [family,setFamily]=useState(initialFamily);
  const [view,setView]=useState(initialFamily?"home":hasLegacy?"migrate":"setup");
  const [activeId,setActiveId]=useState(null);

  const commitFamily=(next)=>{setFamily(next);saveFamily(next);};
  const createFirst=({familyName,playerName,themeId})=>{
    const id=makePlayerId(),storageKey="habitKingdom_player_"+id,now=new Date().toISOString();
    if(hasLegacy){
      const copied={...legacySave,profile:{...legacySave.profile,kidName:playerName}};
      localStorage.setItem(storageKey,JSON.stringify(copied));
      ["lastLogin_hk","lastStreak_hk","musicOn_hk","weather_hk","parkPetPan_hk","parkKidPan_hk"].forEach(k=>{
        const value=localStorage.getItem(k);if(value!==null)localStorage.setItem(k+"_"+id,value);
      });
    }
    const next={version:1,familyName,familyCreatedAt:now,activePlayerId:id,players:[{id,name:playerName,themeId,storageKey,createdAt:now}]};
    commitFamily(next);setActiveId(id);setView("game");
  };
  const addPlayer=({playerName,themeId})=>{
    if(!family||family.players.length>=3)return;
    const id=makePlayerId(),now=new Date().toISOString(),player={id,name:playerName,themeId,storageKey:"habitKingdom_player_"+id,createdAt:now};
    const next={...family,activePlayerId:id,players:[...family.players,player]};commitFamily(next);setActiveId(id);setView("game");
  };
  const selectPlayer=(p)=>{const next={...family,activePlayerId:p.id};commitFamily(next);setActiveId(p.id);setView("game");};
  const updatePlayerName=(id,name)=>{if(!name||!family)return;const next={...family,players:family.players.map(p=>p.id===id?{...p,name}:p)};commitFamily(next);};
  const editFamilyName=()=>{const name=window.prompt("家庭名稱",family.familyName||"我的家庭");if(name&&name.trim())commitFamily({...family,familyName:name.trim()});};

  if(view==="migrate")return <FamilySetup legacy={legacySave} onDone={createFirst}/>;
  if(view==="setup")return <FamilySetup onDone={createFirst}/>;
  if(view==="add")return <FamilySetup addMode defaultName="" onDone={({playerName,themeId})=>addPlayer({playerName,themeId})} onCancel={()=>setView(family.players.length>1?"select":"home")}/>;
  if(view==="home")return <FamilyHome family={family} onEnter={()=>family.players.length===1?selectPlayer(family.players[0]):setView("select")}
    onAdd={()=>setView("add")} onEditName={editFamilyName}/>;
  if(view==="select")return <PlayerSelect family={family} onSelect={selectPlayer} onBack={()=>setView("home")} onAdd={()=>setView("add")}/>;
  const active=family.players.find(p=>p.id===activeId)||family.players.find(p=>p.id===family.activePlayerId)||family.players[0];
  return <App key={active.id} storageKey={active.storageKey} playerId={active.id} playerName={active.name} themeId={active.themeId}
    onProfileChange={name=>updatePlayerName(active.id,name)} onSwitch={()=>setView(family.players.length>1?"select":"home")}/>;
}

/* ═══════════════ MAIN APP ═══════════════ */

  const [closetTab,setClosetTab]=useState("kidTop");
  const [toast,setToast]=useState({msg:"",color:C.butter});
  const [speech,setSpeech]=useState("");
  const [toyPlaying,setToyPlaying]=useState(null);
  const [running,setRunning]=useState(false);
  const [eating,setEating]=useState(false);
  const [petAction,setPetAction]=useState("idle");
  const [petRoomX,setPetRoomX]=useState(50);
  const [actionText,setActionText]=useState("");
  const [horseX,setHorseX]=useState(48);
  const [feedItem,setFeedItem]=useState(null);
  const [showFood,setShowFood]=useState(false);
  const [avatarGender,setAvatarGender]=useState("girl");
  const [avatarSkin,setAvatarSkin]=useState("#F6D2B8");
  const [dMood,setDMood]=useState(3);
  const [dText,setDText]=useState("");
  const [dSaved,setDSaved]=useState(false);
  const [diaryDate,setDiaryDate]=useState(new Date().toLocaleDateString("zh-TW"));
  const [calMonth,setCalMonth]=useState(new Date());

  // wish form
  const [nWLabel,setNWLabel]=useState("");
  const [nWEmoji,setNWEmoji]=useState("🌟");
  const [nWPts,setNWPts]=useState(100);

  const tRef=useRef();
  const actionRef=useRef();
  const parkPetDragRef=useRef(null);
  const parkKidDragRef=useRef(null);

  // persist
  useEffect(()=>{
    try{const s=JSON.parse(localStorage.getItem(saveKey)||"{}");
      if(s.profile)setProfile(s.profile);if(s.points!=null)setPoints(s.points);
      if(s.tasks)setTasks(s.tasks);else setTasks(DEFAULT_TASKS);
      if(s.checked)setChecked(s.checked);if(s.owned)setOwned(s.owned);
      if(s.equipped)setEquipped(s.equipped);if(s.backpack)setBackpack(s.backpack);
      if(s.hunger!=null)setHunger(s.hunger);if(s.diary)setDiary(s.diary);
      if(s.wishes)setWishes(s.wishes);if(s.bonusTasks)setBonusTasks(s.bonusTasks);
      if(s.achievements)setAchievements(s.achievements);if(s.streak!=null)setStreak(s.streak);
      if(s.petMood!=null)setPetMood(s.petMood);if(s.poops)setPoops(s.poops);
      if(s.neglect)setNeglect(s.neglect);
    }catch(e){}
  },[saveKey]);

  useEffect(()=>{
    if(!profile)return;
    localStorage.setItem(saveKey,JSON.stringify({
      profile,points,tasks,checked,owned,equipped,backpack,hunger,diary,wishes,bonusTasks,achievements,streak,petMood,poops,neglect}));
  },[saveKey,profile,points,tasks,checked,owned,equipped,backpack,hunger,diary,wishes,bonusTasks,achievements,streak,petMood,poops,neglect]);

  // UI 偏好獨立保存，避免改動既有 habitKingdom 存檔格式。
  useEffect(()=>{
    const id=setTimeout(()=>{
      localStorage.setItem(playerStorageKey("musicOn_hk"),String(musicOn));
      localStorage.setItem(playerStorageKey("weather_hk"),weather);
      localStorage.setItem(playerStorageKey("parkPetPan_hk"),String(parkPetPan));
      localStorage.setItem(playerStorageKey("parkKidPan_hk"),String(parkKidPan));
    },200);
    return()=>clearTimeout(id);
  },[musicOn,weather,parkPetPan,parkKidPan]);

  // 音樂啟動 - 第一次點擊頁面時啟動
  useEffect(()=>{
    if(!profile)return;
    const startOnClick=()=>{
      if(musicOn){Audio.startMusic(true);}
      document.removeEventListener("click",startOnClick);
      document.removeEventListener("touchstart",startOnClick);
    };
    document.addEventListener("click",startOnClick);
    document.addEventListener("touchstart",startOnClick);
    return()=>{
      document.removeEventListener("click",startOnClick);
      document.removeEventListener("touchstart",startOnClick);
    };
  },[profile,musicOn]);
  useEffect(()=>{
    if(!profile)return;
    const today=new Date().toLocaleDateString("zh-TW");
    const lastLoginKey=playerStorageKey("lastLogin_hk");
    const last=localStorage.getItem(lastLoginKey);
    if(last!==today){
      if(last){
        const prev=new Date(last),now=new Date();prev.setHours(0,0,0,0);now.setHours(0,0,0,0);
        const gap=Math.round((now-prev)/(1000*60*60*24));
        if(gap>=7)setNeglect({level:7,sleeping:true,roomMess:true,dirty:true,cost:20,needsBath:true,welcomePending:true});
        else if(gap>=5)setNeglect({level:5,sleeping:true,roomMess:true,dirty:true,cost:10,needsBath:true,welcomePending:false});
        else if(gap>=3)setNeglect({level:3,sleeping:true,roomMess:true,dirty:false,cost:0,needsBath:false,welcomePending:false});
      }
      localStorage.setItem(lastLoginKey,today);
      setPoints(p=>p+5);
      setTimeout(()=>{toast2("每日登入！+5⭐ 可以買蘋果囉🍎","#88cc88");Audio.login();},900);
    }
    // 清理3天前的任務記錄
    setChecked(prev=>{
      const cleaned={};
      const now=new Date();
      Object.keys(prev).forEach(key=>{
        // key格式: kid-日期-id 或 ok-日期-id 或 wkid-日期-id 或 wkok-日期-id
        const parts=key.split("-");
        if(parts.length>=3){
          // 取出日期部分（第2個-之後，最後一個-之前）
          const dateStr=parts.slice(1,parts.length-1).join("-");
          try{
            const d=new Date(dateStr);
            const diffDays=(now-d)/(1000*60*60*24);
            if(diffDays<=3)cleaned[key]=prev[key];
          }catch(e){cleaned[key]=prev[key];}
        }else{cleaned[key]=prev[key];}
      });
      return cleaned;
    });
  },[profile]);

  // 舊存檔第一次升級時，讓孩子自己建立小主人；不動原本任務與點數
  useEffect(()=>{
    if(profile&&!profile.gender&&modal==null)setModal("avatarSetup");
  },[profile]);

  useEffect(()=>{
    if(profile&&profile.gender&&neglect.welcomePending&&modal==null)setModal("welcomeBack");
  },[profile,neglect.welcomePending,modal]);

  // streak check
  useEffect(()=>{
    if(!profile)return;
    const day=new Date().getDay();
    const today=new Date().toLocaleDateString("zh-TW");
    const allDone=tasks.every(h=>!!checked["ok-"+today+"-"+h.id]);
    if(!allDone)return;
    const lastStreakKey=playerStorageKey("lastStreak_hk");
    const lastS=localStorage.getItem(lastStreakKey);
    if(lastS===today)return;
    const yest=new Date();yest.setDate(yest.getDate()-1);
    const yStr=yest.toLocaleDateString("zh-TW");
    const ns=lastS===yStr?streak+1:1;
    setStreak(ns);
    localStorage.setItem(lastStreakKey,today);
    if(ns===3){toast2("連續3天全部完成！🔥 成就解鎖！","#FF9F3F");unlockAch("a8");}
    if(ns===7){setPoints(p=>p+100);toast2("連續7天！🎉 獎勵+100⭐","#FFD700");unlockAch("a9");}
    if(ns===5){toast2("連續5天！⭐ 超厲害！","#FF9F3F");}
    unlockAch("a10");
  },[checked,profile]);

  // poop - 更可靠的觸發機制
  useEffect(()=>{
    const POOP_HOURS=[7,17,20];
    const check=()=>{
      const now=new Date();
      const h=now.getHours();
      const dateStr=now.toLocaleDateString("zh-TW");
      if(POOP_HOURS.indexOf(h)>=0){
        const key=dateStr+"-h"+h;
        setPoops(ps=>{
          if(ps.find(p=>p.key===key))return ps;
          return [...ps,{key,time:h+":00"}];
        });
      }
    };
    check();
    const t=setInterval(check,30000); // 每30秒檢查一次
    return()=>clearInterval(t);
  },[]);

  useEffect(()=>{if(poops.length>0)setPetMood(m=>Math.max(0,m-4));},[poops.length]);
  useEffect(()=>{const t=setInterval(()=>setHunger(h=>Math.max(0,h-2)),45000);return()=>clearInterval(t);},[]);

  const toast2=useCallback((msg,color)=>{
    setToast({msg,color:color||C.butter});
    if(tRef.current)clearTimeout(tRef.current);
    tRef.current=setTimeout(()=>setToast({msg:"",color:C.butter}),2800);
  },[]);

    setAchievements(prev=>{
      if(prev.indexOf(id)>=0)return prev;
      const a=ACHIEVEMENTS.find(x=>x.id===id);
      if(a){setTimeout(()=>toast2("🏅 成就解鎖："+a.label+"！"),400);Audio.achieve();}
      return [...prev,id];
    });

  },[]);

  // 房間裡的自主生活：散步、打哈欠、睡覺、看窗與使用已放置家具
  useEffect(()=>{
    if(!profile||tab!=="room"||roomEdit||neglect.sleeping)return;

      const actions=[
        {action:"walk",text:"在房間散散步～",x:Math.random()>.5?36:64,duration:4200},

        {action:"sleep",text:"呼嚕……做個好夢 💤",x:50,duration:5200},
        {action:"window",text:"窗外今天看起來真漂亮",x:54,duration:4000},

      });
      const a=actions[Math.floor(Math.random()*actions.length)];startPetAction(a.action,a.text,a.x,a.duration);
    };
    const first=setTimeout(live,2200),timer=setInterval(live,9000);
    return()=>{clearTimeout(first);clearInterval(timer);};
  },[profile,tab,roomEdit,equipped,neglect.sleeping,startPetAction]);

  const saveSnapshot=()=>localStorage.setItem(saveKey,JSON.stringify({
    profile,points,tasks,checked,owned,equipped,backpack,hunger,diary,wishes,bonusTasks,achievements,streak,petMood,poops,neglect
  }));

  if(!profile)return <div style={themeVars(themeId)}><Onboarding initialKidName={playerName} onDone={p=>{
    setProfile(p);if(p.tasks)setTasks(p.tasks);if(onProfileChange)onProfileChange(p.kidName);
  }}/></div>;

  // computed
  const day=new Date().getDay();
  const today=new Date().toLocaleDateString("zh-TW");
  const petType=(profile&&profile.petType)||"horse";
  const isTablet=window.innerWidth>=600;
  const px=isTablet?22:14;
  const fs=b=>b*(isTablet?1.18:1);

  const approved=tasks.filter(h=>!!checked["ok-"+today+"-"+h.id]).length;
  const isWeekend=day===0||day===6;
  const moodFromHabits=approved===0?0:approved<2?1:approved<4?3:approved<6?4:5;
  const mood=Math.min(5,Math.round((moodFromHabits/5*50+petMood/100*50)/20));
  const lv=LEVELS.reduce((a,l)=>points>=l.min?l:a,LEVELS[0]);
  const nxtLv=LEVELS[Math.min(lv.lv,4)];
  const lvProg=lv.lv<5?Math.min(100,((points-lv.min)/(nxtLv.min-lv.min))*100):100;
  const wp=ROOMITEMS.find(i=>i.id===equipped.wp);
  const roomPos={tl:{top:55,left:28},tr:{top:55,right:28},ml:{bottom:92,left:24},mr:{bottom:92,right:24},bl:{bottom:22,left:38},br:{bottom:22,right:38}};

  const NAVS=[
    {k:"home",icon:"🏠",l:"首頁"},
    {k:"tasks",icon:"✅",l:"任務"},
    {k:"park",icon:"🌳",l:"公園"},
    {k:"room",icon:"🏡",l:"房間"},
    {k:"closet",icon:"👕",l:"衣櫃"},

    if(points<item.price){toast2("點數不夠喔！😢","#e05060");return;}

    Audio.buy();unlockAch("a11");
  };
  const equip=(item)=>{
    if(owned.indexOf(item.id)<0)return;
    const slot=item.slot||item.type;
    setEquipped(e=>{
      const next={...e,[slot]:e[slot]===item.id?undefined:item.id};
      if(item.dress&&next[slot])next.kidBottom=undefined;
      if(slot==="kidBottom"&&next[slot]){
        const currentTop=KID_ITEMS.find(i=>i.id===e.kidTop);
        if(currentTop&&currentTop.dress)next.kidTop=undefined;
      }
      return next;
    });
  };
  const patPet=()=>{
    if(neglect.sleeping){
      setNeglect(n=>({...n,sleeping:false}));startPetAction("yawn","嗯……你回來了！🥱",50,3000);
      setSpeech("醒來第一眼就看到你了 💛");setTimeout(()=>setSpeech(""),3000);Audio.pat();return;
    }
    setPetMood(m=>Math.min(100,m+10));
    const msg=PET_SAYS[Math.floor(Math.random()*PET_SAYS.length)];
    setSpeech(msg);setTimeout(()=>setSpeech(""),3000);
    Audio.pat();
    toast2(profile.petName+"被摸摸了！💛");
  };
  const playToy=(toy)=>{
    if(owned.indexOf(toy.id)<0){toast2("需要先購買！","#e05060");return;}
    setToyPlaying(toy.id);setPetMood(m=>Math.min(100,m+toy.joy));
    toast2(profile.petName+"正在玩"+toy.emoji+toy.label+"！","#b35cf8");
    Audio.pat();
    setTimeout(()=>setToyPlaying(null),2500);
  };
  const runPet=()=>{
    if(running)return;setRunning(true);setHorseX(x=>x>50?15:80);
    Audio.ball();
    setTimeout(()=>setRunning(false),2000);
  };
  const feedPet=(item)=>{
    const bp={...backpack};if(!bp[item.id]||bp[item.id]<=0)return;
    bp[item.id]--;setBackpack(bp);setFeedItem(item);setEating(true);
    setHunger(h=>Math.min(100,h+item.hunger));
    Audio.feed();
    setTimeout(()=>{setEating(false);setFeedItem(null);},1500);
  };
  const throwBall=()=>{
    setBallVisible(true);
    setBallX(x=>x>50?20:80);
    Audio.ball();
    setTimeout(()=>{
      setRunning(true);setHorseX(x=>x>50?20:80);
      setTimeout(()=>{setRunning(false);setBallVisible(false);setPetMood(m=>Math.min(100,m+8));
        toast2(profile.petName+"接到球了！🎾","#88cc88");},1800);
    },300);
  };
  const pickFlower=(id)=>{
    setFlowers(fs=>fs.map(f=>f.id===id?{...f,visible:false}:f));
    setPetMood(m=>Math.min(100,m+6));

                <div style={{flex:1}}>
                  <div style={{fontWeight:900,fontSize:fs(12),color:C.brown}}>{w.label}</div>
                  <div style={{fontSize:fs(10),color:"#2a8a2a",fontWeight:800}}>願望成真了！🎉</div>
                </div>
                <span style={{fontSize:20}}>✅</span>
              </div>))}
          </>}

          {wishes.length===0&&<div style={{textAlign:"center",padding:30}}>
            <div style={{fontSize:40,marginBottom:10}}>🌟</div>
            <div style={{fontSize:fs(14),fontWeight:900,color:C.brown,marginBottom:6}}>還沒有願望</div>
            <div style={{fontSize:fs(11),color:C.soft,fontWeight:800}}>許一個願望，努力存星星吧！</div>
          </div>}
        </div>
      )}

      {/* ══════════ NAV ══════════ */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,maxWidth:768,margin:"0 auto",
        background:"rgba(255,251,240,.97)",backdropFilter:"blur(14px)",
        borderTop:"2px solid rgba(255,210,140,.28)",
        display:"flex",padding:isTablet?"6px 16px":"4px 8px",
        paddingBottom:"env(safe-area-inset-bottom,8px)",gap:4,
        height:isTablet?84:70,alignItems:"center"}}>
        {NAVS.map(n=>(
          <button key={n.k} className="btn" onClick={()=>setTab(n.k)}
            style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",
              justifyContent:"center",gap:2,
              padding:isTablet?"10px 0":"7px 0",
              ...bub(tab===n.k?C.yellow:"transparent"),
              borderRadius:(tab===n.k||(n.k==="calendar"&&modal==="calendar"))?999:0,
              boxShadow:(tab===n.k||(n.k==="calendar"&&modal==="calendar"))?"0 4px 0 rgba(0,0,0,.08)":"none",
              border:"none",color:C.brown,
              fontSize:isTablet?12:9,fontWeight:900,
              margin:(tab===n.k||(n.k==="calendar"&&modal==="calendar"))?"2px 2px":"0",
              minHeight:isTablet?60:48}}>
            <span style={{fontSize:isTablet?26:20}}>{n.icon}</span>
            {n.l}
          </button>))}
      </div>
    </div>);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(FamilyRoot));
</script>
</body>
</html>
