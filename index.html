                    fontSize:11,fontWeight:900,color:C.brown,whiteSpace:"nowrap",
                    animation:"bIn .3s",zIndex:10,border:"none",
                    boxShadow:"0 4px 12px rgba(0,0,0,.12)"}}>
                    {speech}
                    <div style={{position:"absolute",bottom:-7,left:"50%",transform:"translateX(-50%)",
                      width:0,height:0,borderLeft:"7px solid transparent",
                      borderRight:"7px solid transparent",borderTop:"7px solid #fff"}}/>
                  </div>}
                  <PetView petType={petType} level={lv.lv} hat={equipped.hat} neck={equipped.neck} back={equipped.back} body={equipped.body} acc={equipped.acc}
                    hunger={hunger} mood={mood} eating={toyPlaying!==null} isNight={isNight} sleeping={neglect.sleeping} size={isTablet?0.72:0.58}/>
                </div>
                {toyPlaying&&<div style={{fontSize:24,animation:"float .5s infinite"}}>
                  {(TOYS.find(t=>t.id===toyPlaying)||{}).emoji}
                </div>}
                <div style={{fontSize:9,color:C.soft,fontWeight:800,marginTop:2}}>點擊摸摸牠 💛</div>
              </div>

              {/* 右欄 */}
              <div style={{display:"flex",flexDirection:"column",gap:8,alignItems:"flex-start"}}>
                {["tr","mr","br"].map(slotId=>{
                  const item=ROOMITEMS.find(r=>r.id===equipped[slotId]);
                  const slotInfo=ROOM_SLOTS.find(s=>s.id===slotId);
                  return(
                    <div key={slotId} style={{
                      width:isTablet?64:50,height:isTablet?64:50,
                      background:"rgba(255,255,255,.35)",borderRadius:16,
                      display:"flex",flexDirection:"column",alignItems:"center",
                      justifyContent:"center",border:"2px dashed rgba(200,150,80,.3)",
                      cursor:item?"pointer":"default",
                      boxShadow:item?"0 3px 0 rgba(0,0,0,.08)":"none",
                      transition:"all .2s"}}
                      onClick={()=>{if(item)setEquipped(e=>({...e,[slotId]:undefined}));}}>
                      {item
                        ?<>
                          <span style={{fontSize:isTablet?28:22}}>{item.emoji}</span>
                          <span style={{fontSize:7,color:C.brown,fontWeight:900,marginTop:1}}>{item.label}</span>
                        </>
                        :<span style={{fontSize:10,color:"rgba(150,100,50,.4)",fontWeight:800}}>{slotInfo.label}</span>}
                    </div>);})}
              </div>
            </div>
          </div>

          {/* 玩具互動 */}
          {TOYS.filter(t=>owned.indexOf(t.id)>=0).length>0&&(
            <div style={{...cardS(C.card),padding:12,marginBottom:10}}>
              <div style={{fontSize:11,color:C.soft,fontWeight:900,marginBottom:8}}>玩具互動 🎮</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                {TOYS.filter(t=>owned.indexOf(t.id)>=0).map(t=>(
                  <button key={t.id} className="btn" onClick={()=>playToy(t)}
                    style={{...bub(toyPlaying===t.id?C.yellow:C.light),borderRadius:16,
                      padding:"8px 12px",fontSize:isTablet?13:11,fontWeight:900,color:C.brown,border:"none"}}>
                    {t.emoji} {t.label}
                  </button>))}
              </div>
            </div>)}

          {/* 換裝配件 */}
          {false&&OUTFITS.filter(o=>owned.indexOf(o.id)>=0).length>0&&(
            <div style={{...cardS(C.card),padding:12,marginBottom:10}}>
              <div style={{fontSize:11,color:C.soft,fontWeight:900,marginBottom:8}}>👗 換裝配件</div>
              <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                {OUTFITS.filter(o=>owned.indexOf(o.id)>=0).map(o=>{
                  const isEq=equipped[o.slot]===o.id;
                  return(
                    <button key={o.id} className="btn"
                      onClick={()=>setEquipped(e=>({...e,[o.slot]:e[o.slot]===o.id?undefined:o.id}))}
                      style={{...bub(isEq?C.yellow:C.light),borderRadius:14,padding:"8px 10px",
                        textAlign:"center",outline:isEq?"3px solid "+C.butter:"none",border:"none"}}>
                      <div style={{fontSize:22}}>{o.emoji}</div>
                      <div style={{fontSize:9,fontWeight:900,color:C.brown}}>{o.label}</div>
                      {isEq&&<div style={{fontSize:8,color:C.soft,fontWeight:900}}>穿戴中</div>}
                    </button>);})}
              </div>
            </div>)}

          {/* 我的裝飾儲藏間 */}
          {roomEdit&&ROOMITEMS.filter(i=>!i.locked&&owned.indexOf(i.id)>=0).length>0&&roomDecorDrawerOpen&&(
            <div style={{position:"fixed",left:"50%",bottom:isTablet?88:76,transform:"translateX(-50%)",
              width:"min(728px,calc(100vw - 20px))",maxHeight:"42vh",overflowY:"auto",zIndex:2600,
              ...cardS("rgba(255,255,255,.96)"),padding:12,border:"2px solid rgba(245,166,35,.24)",
              boxShadow:"0 -8px 28px rgba(80,50,20,.14)"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,marginBottom:10}}>
                <div>
                  <div style={{fontSize:14,fontWeight:900,color:C.brown}}>🏠 我的裝飾</div>
                  <div style={{fontSize:10,fontWeight:800,color:C.soft}}>點一下放進房間，放好後可拖動位置</div>
                </div>
                <button className="btn" onClick={()=>{setRoomEdit(false);setRoomDecorDrawerOpen(false);}}
                  style={{...bub(C.orange,999),minHeight:44,padding:"10px 14px",fontSize:12,fontWeight:900,color:"#fff",border:"none"}}>
                  ✓ 完成布置
                </button>
              </div>
              <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:4}}>
                {ROOMITEMS.filter(i=>!i.locked&&i.type==="wp"&&owned.indexOf(i.id)>=0).map(d=>{
                  const isEq=equipped.wp===d.id;
                  return <button key={d.id} className="btn" onClick={()=>setEquipped(e=>({...e,wp:isEq?undefined:d.id}))}
                    style={{...bub(isEq?C.yellow:C.light,16),padding:"9px 12px",minWidth:86,textAlign:"center",border:"none"}}>
                    <div style={{fontSize:22}}>{d.emoji}</div>
                    <div style={{fontSize:9,fontWeight:900,color:C.brown}}>{d.label}</div>
                    <div style={{fontSize:8,color:isEq?"#2a8a2a":C.soft,fontWeight:900}}>{isEq?"✓ 已放入":"放進房間"}</div>
                  </button>;
                })}
                {ROOMITEMS.filter(i=>!i.locked&&i.type==="dc"&&owned.indexOf(i.id)>=0).map(d=>{
                  const isPlaced=equipped[d.slot]===d.id;
                  return <button key={d.id} className="btn" onClick={()=>{
                    if(isPlaced){setSelectedRoomDecor(d.id);return;}
                    setEquipped(e=>({...e,[d.slot]:d.id}));
                    setSelectedRoomDecor(d.id);toast2(d.emoji+" "+d.label+"放進房間了！","#88cc88");
                  }} style={{...bub(isPlaced?C.yellow:C.light,16),padding:"9px 10px",minWidth:86,textAlign:"center",border:"none",
                    outline:isPlaced?"3px solid "+C.butter:"none"}}>
                    <div style={{height:38,display:"flex",alignItems:"center",justifyContent:"center"}}><RoomItemArt item={d} thumb size={d.asset?38:34}/></div>
                    <div style={{fontSize:9,fontWeight:900,color:C.brown,marginTop:2}}>{d.label}</div>
                    <div style={{fontSize:8,color:isPlaced?"#2a8a2a":C.soft,fontWeight:900}}>{isPlaced?"✓ 已放入":"放進房間"}</div>
                  </button>;
                })}
              </div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginTop:10}}>
                <button className="btn" onClick={()=>{
                  if(confirm("要恢復所有裝飾的預設位置嗎？\n不會清除已購買或已放置的裝飾。"))setRoomDecorPos({});
                }} style={{...bub(C.light,999),minHeight:36,padding:"8px 12px",fontSize:11,fontWeight:900,color:C.soft,border:"none"}}>
                  恢復預設位置
                </button>
                <button className="btn" onClick={()=>setRoomDecorDrawerOpen(false)}
                  style={{...bub(C.card,999),minHeight:36,padding:"8px 12px",fontSize:11,fontWeight:900,color:C.brown,border:"none"}}>
                  收合
                </button>
              </div>
            </div>)}
          {roomEdit&&!roomDecorDrawerOpen&&<button className="btn" onClick={()=>setRoomDecorDrawerOpen(true)}
            style={{position:"fixed",left:"50%",bottom:isTablet?92:82,transform:"translateX(-50%)",zIndex:2600,
              ...bub(C.yellow,999),minHeight:44,padding:"10px 18px",fontSize:13,fontWeight:900,color:C.brown,border:"none"}}>
            🏠 打開我的裝飾
          </button>}
          {false&&roomEdit&&ROOMITEMS.filter(i=>!i.locked&&owned.indexOf(i.id)>=0).length>0&&(
            <div style={{...cardS(C.card),padding:12,marginBottom:10}}>
              {/* header */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                <div style={{...bub(C.yellow,999),padding:"4px 12px",border:"none"}}>
                  <span style={{fontSize:12,fontWeight:900,color:C.brown}}>🏠 我的裝飾</span>
                </div>
                <div style={{fontSize:10,color:C.soft,fontWeight:800}}>
                  點裝飾放入房間，再點移除
                </div>
              </div>

              {/* 壁紙區 */}
              {ROOMITEMS.filter(i=>!i.locked&&i.type==="wp"&&owned.indexOf(i.id)>=0).length>0&&<>
                <div style={{fontSize:10,color:C.soft,fontWeight:900,marginBottom:7}}>🖼️ 壁紙</div>
                <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:12}}>
                  {ROOMITEMS.filter(i=>!i.locked&&i.type==="wp"&&owned.indexOf(i.id)>=0).map(d=>{
                    const isEq=equipped.wp===d.id;
                    return(
                      <button key={d.id} className="btn"
                        onClick={()=>setEquipped(e=>({...e,wp:isEq?undefined:d.id}))}
                        style={{...bub(isEq?C.yellow:C.light),borderRadius:14,
                          padding:"8px 12px",textAlign:"center",border:"none",
                          outline:isEq?"3px solid "+C.butter:"none",minWidth:64}}>
                        <div style={{fontSize:22}}>{d.emoji}</div>
                        <div style={{fontSize:9,fontWeight:900,color:C.brown}}>{d.label}</div>
                        {isEq
                          ?<div style={{fontSize:8,color:"#2a8a2a",fontWeight:900}}>✓ 已放入</div>
                          :<div style={{fontSize:8,color:C.soft,fontWeight:800}}>放進房間</div>}
                      </button>);})}
                </div>
              </>}

              {/* 位置裝飾區 - 按slot分組 */}
              {ROOM_SLOTS.map(slot=>{
                const slotItems=ROOMITEMS.filter(r=>!r.locked&&r.type==="dc"&&r.slot===slot.id&&owned.indexOf(r.id)>=0);
                if(slotItems.length===0)return null;
                const placed=ROOMITEMS.find(r=>!r.locked&&r.id===equipped[slot.id]);
                return(
                  <div key={slot.id} style={{marginBottom:12}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:7}}>
                      <div style={{fontSize:10,color:C.soft,fontWeight:900}}>📍{slot.label}</div>
                      {placed
                        ?<span style={{...bub(C.green,999),padding:"1px 8px",fontSize:9,
                          fontWeight:900,color:"#1a6a1a",border:"none"}}>
                          {placed.emoji} 已放置
                        </span>
                        :<span style={{...bub(C.light,999),padding:"1px 8px",fontSize:9,
                          fontWeight:800,color:C.soft,border:"none"}}>空位
                        </span>}
                    </div>
                    <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                      {slotItems.map(d=>{
                        const isPlaced=equipped[slot.id]===d.id;
                        return(
                          <button key={d.id} className="btn"
                            onClick={()=>{
                              setEquipped(e=>({...e,[slot.id]:isPlaced?undefined:d.id}));
                              if(!isPlaced)toast2(d.emoji+" "+d.label+"放進房間了！","#88cc88");
                            }}
                            style={{...bub(isPlaced?C.yellow:C.light),borderRadius:14,
                              padding:"9px 11px",textAlign:"center",border:"none",
                              outline:isPlaced?"3px solid "+C.butter:"none",minWidth:60}}>
                            <div style={{height:34,display:"flex",alignItems:"center",justifyContent:"center"}}>
                              <RoomItemArt item={d} thumb size={d.asset?36:34}/>
                            </div>
                            <div style={{fontSize:9,fontWeight:900,color:C.brown,marginTop:2}}>{d.label}</div>
                            {isPlaced
                              ?<div style={{fontSize:8,color:"#2a8a2a",fontWeight:900}}>✓ 放置中</div>
                              :<div style={{fontSize:8,color:C.soft,fontWeight:800}}>點擊放入</div>}
                          </button>);})}
                    </div>
                  </div>);})}
            </div>)}

          {/* 還沒有任何裝飾 */}
          {roomEdit&&ROOMITEMS.filter(i=>!i.locked&&owned.indexOf(i.id)>=0).length===0&&(
            <div style={{...cardS(C.light),padding:"18px 14px",textAlign:"center",marginBottom:10}}>
              <div style={{fontSize:32,marginBottom:8}}>🏠</div>
              <div style={{fontSize:13,fontWeight:900,color:C.brown,marginBottom:4}}>還沒有裝飾</div>
              <div style={{fontSize:11,color:C.soft,fontWeight:800}}>可以從底部「商店」購買裝飾後再回來佈置。</div>
            </div>)}
        </div>
      )}

      {/* ══════════ WISH ══════════ */}
      {tab==="wish"&&(
        <div style={{padding:isTablet?"14px 22px 0":"10px 14px 0",
          maxWidth:isTablet?720:480,margin:"0 auto"}}>

          {/* star jar + points */}
          <div style={{...cardS(C.light),padding:"16px",marginBottom:12,
            display:"flex",alignItems:"center",justifyContent:"space-around"}}>
            <div style={{textAlign:"center"}}>
              <StarJar stars={points} max={activeWish?activeWish.pts:500} size={isTablet?1.3:1}/>
              <div style={{fontSize:fs(10),color:C.soft,fontWeight:800,marginTop:4}}>目前⭐</div>
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:fs(28),fontWeight:900,color:C.brown}}>⭐{points}</div>
              <div style={{fontSize:fs(11),color:C.soft,fontWeight:800}}>累積星星</div>
              {activeWish&&<div style={{fontSize:fs(10),color:points>=activeWish.pts?"#2a8a2a":"#d04040",
                fontWeight:900,marginTop:6}}>
                目標：{activeWish.label}<br/>
                {points>=activeWish.pts?"夠了！可以申請！":"還差"+(activeWish.pts-points)+"⭐"}
              </div>}
            </div>
          </div>

          {/* add wish */}
          <div style={{...cardS(C.card),padding:"14px 16px",marginBottom:12}}>
            <div style={{fontSize:fs(13),fontWeight:900,color:C.brown,marginBottom:10}}>✨ 許一個新願望</div>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <input style={{...bub(C.light),borderRadius:16,padding:"9px 10px",
                width:46,fontSize:22,textAlign:"center",border:"none",flexShrink:0}}
                value={nWEmoji} onChange={e=>setNWEmoji(e.target.value)} maxLength={2}/>
              <input style={{...bub(C.light),borderRadius:16,padding:"9px 12px",flex:1,
                fontSize:fs(13),fontWeight:800,color:C.brown,border:"none"}}
                placeholder="我的願望是…" value={nWLabel} onChange={e=>setNWLabel(e.target.value)} maxLength={20}/>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontSize:fs(12),color:C.soft,fontWeight:800}}>我覺得需要：</span>
              {WISH_STAR_OPTIONS.map(v=><button key={v} className="btn" onClick={()=>setNWPts(v)}
                style={{...bub(nWPts===v?C.yellow:C.light,999),padding:"5px 9px",fontSize:fs(11),fontWeight:900,color:C.brown,border:"none"}}>
                {v}⭐
              </button>)}
              <button className="btn" onClick={()=>{
                if(!nWLabel.trim())return;
                const safePts=WISH_STAR_OPTIONS.includes(nWPts)?nWPts:100;
                setWishes(ws=>[...ws,{id:Date.now(),emoji:nWEmoji,label:nWLabel.trim(),
                  kidPts:safePts,pts:safePts,status:"pending"}]);
                setNWLabel("");setNWEmoji("🌟");setNWPts(100);
                toast2("願望送給爸媽了！等確認星星 💛");
              }} style={{...bub(C.orange),marginLeft:"auto",borderRadius:999,
                padding:"8px 16px",fontSize:fs(12),fontWeight:900,color:"#fff",border:"none",
                boxShadow:"0 4px 0 rgba(180,80,0,.2)"}}>送出！</button>
            </div>
          </div>

          {/* wish list - active */}
          {wishes.filter(w=>w.status==="active").length>0&&<>
            <div style={{...bub(C.yellow),borderRadius:999,padding:"3px 14px",
              display:"inline-block",marginBottom:10}}>
              <span style={{fontSize:fs(12),fontWeight:900,color:C.brown}}>🌟 進行中的願望</span>
            </div>
            {wishes.filter(w=>w.status==="active").map(w=>(
              <div key={w.id} style={{...cardS(C.card),padding:"13px 15px",marginBottom:9,
                display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontSize:26}}>{w.emoji||"🌟"}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:900,fontSize:fs(13),color:C.brown}}>{w.label}</div>
                  <div style={{marginTop:6,background:"rgba(0,0,0,.07)",borderRadius:99,height:9,overflow:"hidden"}}>
                    <div style={{width:Math.min(100,(points/w.pts*100))+"%",height:"100%",borderRadius:99,
                      background:"linear-gradient(90deg,"+C.butter+","+C.orange+")",transition:"width .5s"}}/>
                  </div>
                  <div style={{fontSize:fs(10),color:points>=w.pts?"#2a8a2a":"#d04040",fontWeight:800,marginTop:3}}>
                    {points}⭐ / {w.pts}⭐ {points>=w.pts?"✓ 夠了！":""}</div>
                </div>
                {points>=w.pts&&(
                  <button className="btn" onClick={()=>{
                    setWishes(ws=>ws.map(x=>x.id===w.id?{...x,status:"requesting"}:x));
                    toast2("申請送出！等爸媽確認 🌠","#b35cf8");
                  }} style={{...bub(C.orange),borderRadius:999,padding:"8px 13px",
                    fontSize:fs(11),fontWeight:900,color:"#fff",border:"none"}}>申請！</button>)}
              </div>))}
          </>}

          {/* pending */}
          {wishes.filter(w=>w.status==="requesting"||w.status==="pending").length>0&&<>
            <div style={{...bub(C.peach),borderRadius:999,padding:"3px 14px",
              display:"inline-block",marginBottom:10,marginTop:4}}>
              <span style={{fontSize:fs(12),fontWeight:900,color:C.brown}}>⏳ 等待爸媽確認</span>
            </div>
            {wishes.filter(w=>w.status==="requesting"||w.status==="pending").map(w=>(
              <div key={w.id} style={{...cardS(C.peach),padding:"12px 15px",marginBottom:8,
                display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontSize:24}}>{w.emoji||"🌟"}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:900,fontSize:fs(12),color:C.brown}}>{w.label}</div>
                  <div style={{fontSize:fs(10),color:C.soft,fontWeight:800}}>等爸媽設定星星並陪伴確認…</div>
                </div>
                <span style={{fontSize:20}}>⏳</span>
              </div>))}
          </>}

          {/* done */}
          {wishes.filter(w=>w.status==="done").length>0&&<>
            <div style={{...bub(C.green),borderRadius:999,padding:"3px 14px",
              display:"inline-block",marginBottom:10,marginTop:4}}>
              <span style={{fontSize:fs(12),fontWeight:900,color:C.brown}}>🎉 已實現的願望</span>
            </div>
            {wishes.filter(w=>w.status==="done").map(w=>(
              <div key={w.id} style={{...cardS(C.green),padding:"12px 15px",marginBottom:8,
                display:"flex",alignItems:"center",gap:12,opacity:.8}}>
                <span style={{fontSize:24}}>{w.emoji||"🌟"}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:900,fontSize:fs(12),color:C.brown}}>{w.label}</div>
                  <div style={{fontSize:fs(10),color:"#2a8a2a",fontWeight:800}}>願望成真了！🎉</div>
                </div>
                <span style={{fontSize:20}}>✅</span>
              </div>))}
          </>}

          {wishes.length===0&&<div style={{textAlign:"center",padding:30}}>
            <div style={{fontSize:40,marginBottom:10}}>🌟</div>
            <div style={{fontSize:fs(14),fontWeight:900,color:C.brown,marginBottom:6}}>還沒有願望</div>
            <div style={{fontSize:fs(11),color:C.soft,fontWeight:800}}>許一個願望，努力存星星吧！</div>
          </div>}
        </div>
      )}

      {/* ══════════ NAV ══════════ */}
      <div style={{position:"fixed",bottom:"calc(env(safe-area-inset-bottom, 0px) + 12px)",left:0,right:0,maxWidth:768,margin:"0 auto",
        background:"rgba(255,251,240,.97)",backdropFilter:"blur(14px)",
        borderTop:"2px solid rgba(255,210,140,.28)",
        display:"flex",padding:isTablet?"6px 16px":"4px 8px",
        paddingBottom:isTablet?6:5,gap:4,
        height:isTablet?84:70,alignItems:"center"}}>
        {NAVS.map(n=>(
          <button key={n.k} className="btn" onClick={()=>{
            if(n.k==="shop"){showJit("shop");setShopTab("food");setModal("shop");return;}
            goTab(n.k);
          }}
            style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",
              justifyContent:"center",gap:2,
              padding:isTablet?"10px 0":"7px 0",
              ...bub((tab===n.k||(n.k==="shop"&&modal==="shop"))?C.yellow:"transparent"),
              borderRadius:(tab===n.k||(n.k==="shop"&&modal==="shop")||(n.k==="calendar"&&modal==="calendar"))?999:0,
              boxShadow:(tab===n.k||(n.k==="shop"&&modal==="shop")||(n.k==="calendar"&&modal==="calendar"))?"0 4px 0 rgba(0,0,0,.08)":"none",
              border:"none",color:C.brown,
              fontSize:isTablet?12:9,fontWeight:900,
              margin:(tab===n.k||(n.k==="shop"&&modal==="shop")||(n.k==="calendar"&&modal==="calendar"))?"2px 2px":"0",
              minHeight:isTablet?60:48}}>
            <span style={{fontSize:isTablet?26:20}}>{n.icon}</span>
            {n.l}
          </button>))}
      </div>
    </div>);
}
