/* ═══════════════ AUDIO SYSTEM ═══════════════ */
function createAudio(){
  let ctx=null,musicNodes=[],musicOn=true;
  const getCtx=()=>{
    if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
    return ctx;
  };
  const beep=(freq,dur,vol,type)=>{
    try{
      const c=getCtx(),o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type=type||"sine";o.frequency.setValueAtTime(freq,c.currentTime);
      g.gain.setValueAtTime(vol||0.3,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+dur);
      o.start(c.currentTime);o.stop(c.currentTime+dur);
    }catch(e){}
  };
  const playChord=(freqs,dur,vol)=>{freqs.forEach(f=>beep(f,dur,vol||0.15));};

  return{
    check:()=>{
      // happy ascending ding
      beep(523,.1,.3);
      setTimeout(()=>beep(659,.1,.3),80);
      setTimeout(()=>beep(784,.15,.35),160);
    },
    approve:()=>{
      // triumphant chord
      playChord([523,659,784],.4,.2);
      setTimeout(()=>playChord([659,784,1047],.5,.18),200);
    },
    feed:()=>{
      // cute nom nom
      beep(392,.08,.2,"triangle");
      setTimeout(()=>beep(440,.08,.2,"triangle"),120);
      setTimeout(()=>beep(392,.08,.2,"triangle"),240);
    },
    pat:()=>{
      // sparkle sound
      beep(880,.08,.15,"sine");
      setTimeout(()=>beep(1047,.08,.15),60);
      setTimeout(()=>beep(1319,.12,.15),120);
    },
    achieve:()=>{
      // fanfare
      const notes=[523,659,784,1047];
      notes.forEach((f,i)=>setTimeout(()=>beep(f,.2,.25),i*100));
      setTimeout(()=>playChord([659,784,1047],.6,.2),450);
    },
    login:()=>{
      // gentle morning chime
      beep(528,.15,.2,"sine");
      setTimeout(()=>beep(660,.15,.2),150);
      setTimeout(()=>beep(792,.2,.2),300);
    },
    weekend:()=>{
      // celebration
      playChord([523,659],.15,.2);
      setTimeout(()=>playChord([659,784],.15,.2),200);
      setTimeout(()=>playChord([784,1047],.3,.2),400);
    },
    clean:()=>{
      // whoosh clean
      beep(300,.05,.15,"sawtooth");
      setTimeout(()=>beep(600,.1,.15,"sine"),80);
      setTimeout(()=>beep(900,.15,.15,"sine"),160);
    },
    buy:()=>{
      beep(440,.08,.2);
      setTimeout(()=>beep(550,.08,.2),100);
      setTimeout(()=>beep(660,.12,.2),200);
    },
    bath:()=>{
      // splashing sound
      beep(400,.06,.15,"triangle");
      setTimeout(()=>beep(500,.06,.15,"triangle"),80);
      setTimeout(()=>beep(450,.06,.15,"triangle"),160);
      setTimeout(()=>beep(520,.1,.15,"triangle"),240);
    },
    flower:()=>{
      beep(659,.1,.2,"sine");
      setTimeout(()=>beep(784,.1,.2),100);
      setTimeout(()=>beep(1047,.15,.2),200);
    },
    ball:()=>{
      beep(300,.05,.2,"triangle");
      setTimeout(()=>beep(200,.1,.15,"triangle"),100);
    },
    startMusic:(onOff)=>{
      musicOn=onOff;
      if(!onOff){musicNodes.forEach(n=>{try{n.stop();}catch(e){}});musicNodes=[];return;}
      try{
        const c=getCtx();
        const timers=[];
        const pNote=(freq,st,dur,vol,type)=>{
          const o=c.createOscillator(),g=c.createGain();
          o.connect(g);g.connect(c.destination);
          o.type=type||"triangle";
          o.frequency.setValueAtTime(freq,st);
          g.gain.setValueAtTime(0,st);
          g.gain.linearRampToValueAtTime(vol,st+0.025);
          g.gain.exponentialRampToValueAtTime(vol*0.2,st+dur*0.65);
          g.gain.exponentialRampToValueAtTime(0.001,st+dur*1.3);
          o.start(st);o.stop(st+dur*1.4);
          musicNodes.push(o);
        };
        // 卡農和弦 C-G-Am-Em-F-C-F-G
        const bassSeq=[261,196,220,164,174,261,174,196];
        const beatLen=2.0;
        // 卡農主旋律
        const canonTheme=[
          {f:523,d:.5},{f:493,d:.5},{f:440,d:.5},{f:392,d:.5},
          {f:349,d:.5},{f:392,d:.5},{f:440,d:.5},{f:349,d:.5},
          {f:329,d:.5},{f:349,d:.5},{f:392,d:.5},{f:329,d:.5},
          {f:293,d:.5},{f:329,d:.5},{f:349,d:.5},{f:293,d:.5},
        ];
        // 動森五聲音階點綴
        const acPenta=[523,587,659,784,880,1047];
        const acMelody=[2,4,5,4,2,0,2,4,5,2,4,5];
        let loopT=c.currentTime+0.5;
        const playLoop=()=>{
          if(!musicOn)return;
          // 低音和弦
          bassSeq.forEach((freq,i)=>{
            pNote(freq,loopT+i*beatLen,beatLen*0.85,0.020,"sine");
            pNote(freq*1.5,loopT+i*beatLen+0.4,beatLen*0.5,0.010,"sine");
          });
          // 卡農主旋律第一聲部
          let off=0;
          canonTheme.forEach(n=>{pNote(n.f,loopT+off,n.d,0.032,"triangle");off+=n.d;});
          // 卡農第二聲部（延遲2拍，低八度）
          off=0;
          canonTheme.forEach(n=>{pNote(n.f*0.5,loopT+beatLen*2+off,n.d,0.016,"sine");off+=n.d;});
          // 動森點綴（第4拍後輕輕飄入）
          let acOff=beatLen*3.5;
          acMelody.forEach((idx,i)=>{
            pNote(acPenta[idx],loopT+acOff+i*0.52,0.48,0.020,"triangle");
          });
          const totalDur=bassSeq.length*beatLen;
          loopT+=totalDur+1.2;
          const tid=setTimeout(playLoop,(totalDur+0.8)*1000);
          timers.push(tid);
        };
        playLoop();
      }catch(e){}
    },
    setMusicOn:(v)=>{musicOn=v;},
    stopMusic:()=>{musicNodes.forEach(n=>{try{n.stop();}catch(e){}});musicNodes=[];}
  };
}
const Audio=createAudio();
function StarJar({stars,max,size}){
  size=size||1;
  const pct=Math.min(100,(stars/Math.max(max,1))*100);
  const w=90*size,h=100*size;
  return(
    <svg width={w} height={h} viewBox="0 0 90 100">
      <rect x="6" y="22" width="78" height="72" rx="14" fill="#FFF8D0" stroke="#E8C840" strokeWidth="2.5"/>
      <clipPath id="jc"><rect x="8" y="24" width="74" height="68" rx="12"/></clipPath>
      <rect x="8" y={24+68*(1-pct/100)} width="74" height={68*pct/100}
        fill="#FFE566" opacity=".55" clipPath="url(#jc)"/>
      <ellipse cx="24" cy="38" rx="7" ry="12" fill="#fff" opacity=".25" clipPath="url(#jc)"/>
      {pct>8&&<text x="45" y="80" fontSize="18" textAnchor="middle">⭐</text>}
      {pct>25&&<text x="28" y="65" fontSize="14" textAnchor="middle">⭐</text>}
      {pct>45&&<text x="63" y="60" fontSize="13" textAnchor="middle">⭐</text>}
      {pct>65&&<text x="40" y="50" fontSize="11" textAnchor="middle">⭐</text>}
      <rect x="16" y="14" width="58" height="12" rx="6" fill="#E8C840"/>
      <rect x="28" y="8" width="34" height="10" rx="5" fill="#E8C840"/>
      <rect x="6" y="22" width="78" height="72" rx="14" fill="none" stroke="#E8C840" strokeWidth="2.5"/>
    </svg>);
}

/* ═══════════════ NUMPAD ═══════════════ */
function NumPad({title,subtitle,onSuccess,onClose,correctPin}){
  const [inp,setInp]=useState("");
  const [shake,setShake]=useState(false);
  const keys=["1","2","3","4","5","6","7","8","9","","0","⌫"];
  const press=(k)=>{
    if(k==="⌫"){setInp(p=>p.slice(0,-1));return;}
    if(!k) return;
    const next=inp+k;
    setInp(next);
    if(next.length===correctPin.length){
      if(next===correctPin){onSuccess();}
      else{setShake(true);setTimeout(()=>{setShake(false);setInp("");},600);}
    }
  };
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(60,20,0,.45)",backdropFilter:"blur(8px)",
      zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}
      onClick={onClose}>
      <div style={{...cardS(C.card),padding:"28px 24px",width:"100%",maxWidth:340,
        animation:"bIn .35s"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:36,textAlign:"center",marginBottom:8}}>🔐</div>
        <div style={{fontSize:18,fontWeight:900,color:C.brown,textAlign:"center",marginBottom:4}}>{title||"家長登入"}</div>
        {subtitle&&<div style={{fontSize:11,color:C.soft,fontWeight:800,textAlign:"center",marginBottom:16}}>{subtitle}</div>}
        {/* dots */}
        <div style={{display:"flex",justifyContent:"center",gap:10,marginBottom:20,
          animation:shake?"shake .4s":""}}>
          {Array.from({length:correctPin.length}).map((_,i)=>(
            <div key={i} style={{width:16,height:16,borderRadius:999,
              background:i<inp.length?C.brown:"rgba(0,0,0,.12)",
              transition:"background .15s"}}/>))}
        </div>
        {/* numpad */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {keys.map((k,i)=>(
            <button key={i} className="btn" onClick={()=>press(k)}
              style={{...bub(k&&k!=="⌫"?C.yellow:k==="⌫"?C.peach:"transparent"),
                borderRadius:16,padding:"14px 0",fontSize:20,fontWeight:900,
                color:C.brown,visibility:k?"visible":"hidden",
                border:"none"}}>
              {k}
            </button>))}
        </div>
        <button className="btn" onClick={onClose}
          style={{...bub(C.light),width:"100%",padding:"11px 0",borderRadius:999,
            fontSize:13,fontWeight:900,color:C.soft,marginTop:14,border:"none"}}>取消</button>
      </div>
    </div>);
}

  const [editPts,setEditPts]=useState(10);

  const totalPts=tasks.reduce((a,t)=>a+t.pts,0);

  // 6 steps: 0=welcome, 1=pet, 2=kidName, 3=petName, 4=tasks, 5=pin
  const next=()=>{
    setErr("");
    if(step===2&&!kidName.trim())return setErr("請輸入你的名字！");
    if(step===4){
      if(totalPts>100)return setErr("習慣總分超過100分了，請調整一下 😊");
      if(tasks.length===0)return setErr("至少需要一個習慣任務！");
    }
    if(step===5){
      if(pin.length<4)return setErr("請設定至少4位數字密碼！");
      if(pin!==pin2)return setErr("兩次密碼不一樣喔！");
      onDone({kidName:kidName.trim(),petName:petName.trim()||"剛出生的小寶寶",pin,petType,tasks,gender,skin});return;
    }
    setStep(s=>s+1);
  };

  const removeTask=(id)=>setTasks(ts=>ts.filter(t=>t.id!==id));
  const addTask=()=>{
    if(!newLabel.trim())return;
    if(totalPts+newPts>100)return setErr("加了這個任務會超過100分喔 😊");
    setTasks(ts=>[...ts,{id:Date.now(),icon:newIcon,label:newLabel.trim(),pts:newPts}]);
    setNewLabel("");setNewPts(10);setNewIcon("⭐");setErr("");

  const saveEdit=()=>{
    if(!editLabel.trim())return;
    const next=tasks.filter(t=>t.id!==editIdx).reduce((a,t)=>a+t.pts,0)+editPts;
    if(next>100)return setErr("修改後總分會超過100分喔 😊");

    {icon:"⭐",title:"點數",text:"每日登入 +5，完成習慣最多 +100，可以買食物、玩具餵寵物並實現許的願望！"},
    {icon:"🌠",title:"願望清單",text:"孩子許願 → 爸媽設定星星數 → 孩子努力存夠 → 爸媽決定實現"},
    {icon:"🎵",title:"音樂",text:"家長後台可以隨時開關！"},
  ];

    <div style={{minHeight:"100vh",background:"linear-gradient(160deg,#FFFBF0,#FFF5E8,#FFF0F8)",
      display:"flex",alignItems:"center",justifyContent:"center",padding:20,overflowY:"auto"}}>
      <div style={{...cardS(C.card),padding:"28px 20px",width:"100%",maxWidth:440}}>

        {step>0&&<div style={{display:"flex",gap:6,justifyContent:"center",marginBottom:22}}>
          {[1,2,3,4,5].map(i=>(
            <div key={i} style={{height:9,width:i===step?26:9,borderRadius:999,
              background:i===step?C.orange:i<step?C.butter:"#f0e0c0",transition:"all .3s"}}/>))}
        </div>}

        {step===0&&<>
          <div style={{textAlign:"center",marginBottom:16}}>
            <div style={{fontSize:48,marginBottom:8}}>🐾</div>
            <div style={{fontSize:22,fontWeight:900,color:C.brown,marginBottom:6}}>寵物習慣王國</div>
            <div style={{fontSize:12,color:C.soft,fontWeight:800,lineHeight:1.8}}>
              用養寵物的方式<br/>讓孩子愛上每天的好習慣 🌟
            </div>
          </div>

            <button className="btn" onClick={()=>setGuideOpen(g=>!g)}
              style={{width:"100%",padding:"13px 16px",background:"transparent",

              <span style={{fontSize:13,fontWeight:900,color:C.brown}}>📖 給爸媽的小說明</span>
              <span style={{fontSize:16,color:C.soft,transition:"transform .3s",display:"inline-block",

                      <button className="btn" onClick={()=>setEditIdx(null)}
                        style={{...bub(C.light),borderRadius:999,padding:"5px 10px",
                          fontSize:11,fontWeight:900,color:C.soft,border:"none"}}>取消</button>
                    </div>
                  </div>
                  :<div style={{...bub(C.light,18),padding:"9px 12px",
                    display:"flex",alignItems:"center",gap:8,border:"none"}}>
                    <span style={{fontSize:18}}>{t.icon}</span>
                    <span style={{flex:1,fontSize:12,fontWeight:800,color:C.brown}}>{t.label}</span>
                    <span style={{...bub(C.peach,999),padding:"2px 8px",fontSize:10,fontWeight:900,color:C.brown,border:"none"}}>{t.pts}分</span>
                    <button className="btn" onClick={()=>{setEditIdx(t.id);setEditLabel(t.label);setEditPts(t.pts);setEditIcon(t.icon);}}
                      style={{...bub(C.butter,10),padding:"4px 9px",fontSize:11,fontWeight:900,color:C.brown,border:"none"}}>✏️</button>
                    <button className="btn" onClick={()=>removeTask(t.id)}
                      style={{...bub("#FFD0D0",10),padding:"4px 9px",fontSize:11,fontWeight:900,color:"#c03030",border:"none"}}>✕</button>
                  </div>}
              </div>
            ))}
          </div>
          <div style={{...bub(C.cream,18),padding:"10px 12px",border:"none",marginBottom:8}}>
            <div style={{fontSize:10,color:C.soft,fontWeight:900,marginBottom:7}}>➕ 新增任務</div>
            <div style={{display:"flex",gap:6,marginBottom:7,alignItems:"center"}}>
              <input style={{...bub(C.card,12),padding:"6px 8px",width:42,fontSize:18,
                textAlign:"center",border:"none",fontWeight:900,color:C.brown}}
                value={newIcon} onChange={e=>setNewIcon(e.target.value)} maxLength={2}/>
              <input style={{...bub(C.card,12),flex:1,padding:"6px 10px",fontSize:12,
                fontWeight:800,color:C.brown,border:"none"}} placeholder="任務名稱…"
                value={newLabel} onChange={e=>setNewLabel(e.target.value)} maxLength={16}/>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:11,color:C.soft,fontWeight:800}}>分數：</span>
              <input type="number" inputMode="numeric" min="5" max="50" value={newPts}
                onChange={e=>setNewPts(Number(e.target.value))}
                style={{width:50,...bub(C.card,10),padding:"4px 6px",fontSize:13,
                  fontWeight:900,color:C.brown,border:"none",textAlign:"center"}}/>
              <button className="btn" onClick={addTask}
                style={{...bub(totalPts+newPts>100?"#FFD0D0":C.orange),borderRadius:999,padding:"5px 16px",
                  fontSize:11,fontWeight:900,color:totalPts+newPts>100?"#c03030":"#fff",
                  border:"none",marginLeft:"auto"}}>新增</button>
            </div>
          </div>
          <div style={{fontSize:10,color:C.soft,fontWeight:800,textAlign:"center"}}>之後也可以在家長後台修改 🔐</div>
        </>}

        {step===5&&<>
          <div style={{fontSize:21,fontWeight:900,color:C.brown,textAlign:"center",marginBottom:6}}>設定家長密碼🔐</div>
          <div style={{fontSize:12,color:C.soft,fontWeight:800,textAlign:"center",marginBottom:14}}>核准任務和管理願望時需要</div>
          {[{v:pin,set:setPin},{v:pin2,set:setPin2}].map((f,i)=>(
            <div key={i} style={{...bub(C.light),borderRadius:20,padding:"12px 16px",
              display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
              <span style={{fontSize:22}}>🔒</span>
              <input style={{flex:1,fontSize:18,fontWeight:900,color:C.brown,letterSpacing:6}} type="password"
                inputMode="numeric" pattern="[0-9]*" placeholder="••••" value={f.v}
                onChange={e=>f.set(e.target.value.replace(/\D/g,"").slice(0,6))}
                onKeyDown={e=>e.key==="Enter"&&next()} maxLength={6} autoFocus={i===0}/>
            </div>))}
        </>}

        {err&&<div style={{color:"#d04040",fontSize:12,fontWeight:800,textAlign:"center",margin:"6px 0"}}>{err}</div>}

        {step>0&&<button className="btn" onClick={next} style={{
          ...bub(C.orange),width:"100%",padding:"14px 0",borderRadius:999,
          fontSize:15,fontWeight:900,color:"#fff",marginTop:14,
          boxShadow:"0 6px 0 rgba(180,80,0,.2)"}}>
          {step<5?"下一步 →":"🎉 開始冒險！"}
        </button>}
        {step>0&&<div style={{textAlign:"center",marginTop:10}}>
          <span onClick={()=>setStep(s=>s-1)}
            style={{color:"#c0a080",fontSize:12,fontWeight:800,cursor:"pointer"}}>← 返回</span>
        </div>}
      </div>
    </div>);
}
/* ═══════════════ PARENT PANEL ═══════════════ */
function ParentPanel({profile,checked,setChecked,points,setPoints,wishes,setWishes,bonusTasks,setBonusTasks,tasks,setTasks,musicOn,setMusicOn,onClose}){
  const [authed,setAuthed]=useState(false);
  const [ptab,setPtab]=useState("tasks");
  const [nTask,setNTask]=useState(""),nPts=useRef(20);
  const [rst,setRst]=useState(false);
  const [hEditIdx,setHEditIdx]=useState(null);
  const [hEditLabel,setHEditLabel]=useState("");
  const [hEditPts,setHEditPts]=useState(10);

  const [hNewLabel,setHNewLabel]=useState("");

  if(!authed)return(
    <NumPad title="家長登入" subtitle="輸入你設定的數字密碼"

  return(
    <Overlay onClose={onClose} wide>
      <div style={{fontSize:20,fontWeight:900,color:C.brown,textAlign:"center",marginBottom:14}}>家長控制台 👨‍👩‍👧</div>
      {/* tabs */}
      <div style={{display:"flex",gap:4,...bub(C.light,20),padding:4,marginBottom:16}}>
        {TABS.map(t=>(
          <button key={t.k} className="btn" onClick={()=>setPtab(t.k)}
            style={{flex:1,padding:"8px 4px",borderRadius:16,fontSize:11,fontWeight:900,color:C.brown,
              background:ptab===t.k?C.yellow:"transparent",
              boxShadow:ptab===t.k?"0 3px 0 rgba(0,0,0,.08)":"none",border:"none"}}>{t.l}</button>))}
      </div>

      {ptab==="tasks"&&<>
        <div style={{fontSize:11,color:C.soft,fontWeight:800,marginBottom:10}}>小孩完成後才能核准 ⭐</div>
        {tasks.map(h=>{
          const kidKey="kid-"+today+"-"+h.id;
          const okKey="ok-"+today+"-"+h.id;
          const kidDone=!!checked[kidKey];
          const approved=!!checked[okKey];
          return(
            <div key={h.id} style={{display:"flex",alignItems:"center",gap:10,
              ...bub(approved?C.yellow:kidDone?C.green:C.light,18),
              padding:"12px 14px",marginBottom:8,border:"none"}}>
              <span style={{fontSize:22}}>{h.icon}</span>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:800,fontSize:13,color:C.brown}}>{h.label}</div>
                <div style={{fontSize:10,fontWeight:800,marginTop:2,
                  color:approved?"#2a8a2a":kidDone?"#1a6a1a":"#c0a080"}}>
                  {approved?"✅ 已核准":kidDone?"✓ 小孩已完成，等待核准":"⏳ 還沒完成"}
                </div>
              </div>
              <span style={{...bub(C.peach),borderRadius:999,padding:"2px 9px",fontSize:11,fontWeight:900,color:C.brown}}>+{h.pts}⭐</span>
              {approved
                ?<span style={{fontSize:18}}>✅</span>
                :kidDone
                ?<button className="btn" onClick={()=>{setChecked(c=>({...c,[okKey]:true}));setPoints(p=>p+h.pts);Audio.approve();}}
                  style={{...bub(C.orange),borderRadius:999,padding:"6px 14px",fontSize:12,fontWeight:900,color:"#fff",border:"none"}}>核准</button>
                :<span style={{fontSize:11,color:"#c0a080",fontWeight:800}}>等待</span>}
            </div>);})}
      </>}

      {ptab==="habits"&&<>
          <div style={{fontSize:11,color:C.soft,fontWeight:800,marginBottom:10}}>
            可以新增、修改、刪除習慣任務 ✏️
          </div>
          {tasks.map(t=>(
            <div key={t.id} style={{marginBottom:8}}>
              {hEditIdx===t.id
                ?<div style={{...bub(C.yellow,18),padding:"10px 12px",border:"none"}}>
                  <div style={{display:"flex",gap:6,marginBottom:8,alignItems:"center"}}>
                    <input style={{...bub(C.card,12),padding:"6px 8px",width:42,fontSize:18,
                      textAlign:"center",border:"none",fontWeight:900,color:C.brown}}
                      value={hEditIcon} onChange={e=>setHEditIcon(e.target.value)} maxLength={2}/>
                    <input style={{...bub(C.card,12),flex:1,padding:"6px 10px",fontSize:12,
                      fontWeight:800,color:C.brown,border:"none"}}
                      value={hEditLabel} onChange={e=>setHEditLabel(e.target.value)} maxLength={16}/>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <span style={{fontSize:11,color:C.soft,fontWeight:800}}>分數：</span>
                    <input type="number" inputMode="numeric" min="5" max="50" value={hEditPts}

                      fontSize:11,fontWeight:900,color:"#fff",border:"none",marginLeft:"auto"}}>儲存</button>
                    <button className="btn" onClick={()=>setHEditIdx(null)}
                      style={{...bub(C.light),borderRadius:999,padding:"5px 10px",
                        fontSize:11,fontWeight:900,color:C.soft,border:"none"}}>取消</button>
                  </div>
                </div>
                :<div style={{...bub(C.light,18),padding:"10px 12px",
                  display:"flex",alignItems:"center",gap:8,border:"none"}}>
                  <span style={{fontSize:18}}>{t.icon}</span>
                  <span style={{flex:1,fontSize:12,fontWeight:800,color:C.brown}}>{t.label}</span>
                  <span style={{...bub(C.peach,999),padding:"2px 8px",fontSize:10,fontWeight:900,color:C.brown,border:"none"}}>
                    {t.pts}分
                  </span>
                  <button className="btn" onClick={()=>{setHEditIdx(t.id);setHEditLabel(t.label);setHEditPts(t.pts);setHEditIcon(t.icon);}}
                    style={{...bub(C.butter,10),padding:"4px 9px",fontSize:11,fontWeight:900,color:C.brown,border:"none"}}>✏️</button>
                  <button className="btn" onClick={()=>setTasks(ts=>ts.filter(x=>x.id!==t.id))}
                    style={{...bub("#FFD0D0",10),padding:"4px 9px",fontSize:11,fontWeight:900,color:"#c03030",border:"none"}}>✕</button>
                </div>}
            </div>
          ))}
          <div style={{...bub(C.cream,18),padding:"10px 12px",border:"none",marginTop:8}}>
            <div style={{fontSize:10,color:C.soft,fontWeight:900,marginBottom:7}}>➕ 新增習慣</div>
            <div style={{display:"flex",gap:6,marginBottom:7,alignItems:"center"}}>
              <input style={{...bub(C.card,12),padding:"6px 8px",width:42,fontSize:18,
                textAlign:"center",border:"none",fontWeight:900,color:C.brown}}
                value={hNewIcon} onChange={e=>setHNewIcon(e.target.value)} maxLength={2}/>
              <input style={{...bub(C.card,12),flex:1,padding:"6px 10px",fontSize:12,
                fontWeight:800,color:C.brown,border:"none"}} placeholder="習慣名稱…"
                value={hNewLabel} onChange={e=>setHNewLabel(e.target.value)} maxLength={16}/>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:11,color:C.soft,fontWeight:800}}>分數：</span>
              <input type="number" inputMode="numeric" min="5" max="50" value={hNewPts}
                onChange={e=>setHNewPts(Number(e.target.value))}
                style={{width:50,...bub(C.card,10),padding:"4px 6px",fontSize:13,
                  fontWeight:900,color:C.brown,border:"none",textAlign:"center"}}/>
              <button className="btn" onClick={()=>{
                if(!hNewLabel.trim())return;
                setTasks(ts=>[...ts,{id:Date.now(),icon:hNewIcon,label:hNewLabel.trim(),pts:hNewPts}]);
                setHNewLabel("");setHNewPts(10);setHNewIcon("⭐");
              }} style={{...bub(C.orange),borderRadius:999,padding:"5px 16px",
                fontSize:11,fontWeight:900,color:"#fff",border:"none",marginLeft:"auto"}}>新增</button>
            </div>
          </div>
      </>}

      {ptab==="bonus"&&<>
        <div style={{...bub(C.light,20),padding:14,marginBottom:14,border:"none"}}>

            <span style={{fontSize:18}}>✏️</span>
            <input style={{flex:1,fontSize:13,fontWeight:800,color:C.brown}} placeholder="挑戰任務名稱…"
              value={nTask} onChange={e=>setNTask(e.target.value)} maxLength={20}/>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{fontSize:12,color:C.soft,fontWeight:800}}>獎勵點數：</span>

              onChange={e=>nPts.current=Number(e.target.value)}
              style={{width:60,...bub(C.card,12),padding:"5px 8px",fontSize:14,fontWeight:900,color:C.brown,border:"none",textAlign:"center"}}/>

              setNTask("");

            <span style={{...bub(C.peach),borderRadius:999,padding:"2px 9px",fontSize:11,fontWeight:900,color:C.brown}}>+{t.pts}⭐</span>

      {ptab==="wish"&&<>

              <span style={{fontSize:20}}>{w.emoji||"🌟"}</span>
              <div style={{flex:1}}>
                <div style={{fontWeight:900,fontSize:13,color:C.brown}}>{w.label}</div>

                  <span style={{fontSize:11,color:C.soft,fontWeight:800}}>正式點數：</span>
                  <input type="number" inputMode="numeric" defaultValue={w.kidPts||100}
                    onChange={e=>setWishes(ws=>ws.map(x=>x.id===w.id?{...x,pts:Number(e.target.value)}:x))}
                    style={{width:55,...bub(C.card,10),padding:"3px 6px",fontSize:13,fontWeight:900,color:C.brown,border:"none",textAlign:"center"}}/>
                </div>
                <div style={{display:"flex",gap:6}}>
                  <button className="btn" onClick={()=>setWishes(ws=>ws.map(x=>x.id===w.id?{...x,status:"active"}:x))}

                  <button className="btn" onClick={()=>setWishes(ws=>ws.map(x=>x.id===w.id?{...x,status:"denied"}:x))}

        {wishes.filter(w=>w.status!=="pending").length===0&&wishes.filter(w=>w.status==="pending").length===0&&
          <div style={{textAlign:"center",color:"#c0a080",fontWeight:800,fontSize:13,padding:16}}>還沒有願望，等小孩新增吧！</div>}
        {wishes.filter(w=>w.status!=="pending").map(w=>(

            {w.status==="active"&&<button className="btn"
              onClick={()=>setWishes(ws=>ws.map(x=>x.id===w.id?{...x,status:"done"}:x))}
              style={{...bub(C.green),borderRadius:999,padding:"4px 10px",fontSize:10,fontWeight:900,color:C.brown,border:"none"}}>標記實現</button>}
          </div>))}
      </>}

      {ptab==="music"&&<>
        <div style={{...bub(C.light,20),padding:"20px 16px",textAlign:"center",border:"none"}}>
          <div style={{fontSize:40,marginBottom:10}}>🎵</div>
          <div style={{fontSize:15,fontWeight:900,color:C.brown,marginBottom:6}}>背景音樂</div>
          <div style={{fontSize:11,color:C.soft,fontWeight:800,marginBottom:20}}>動森風輕音樂</div>
          <button className="btn" onClick={()=>{
            const next=!musicOn;setMusicOn(next);
            if(next){Audio.startMusic(true);toast2("🎵 音樂開啟！");}

          }} style={{...bub(musicOn?C.yellow:C.light),borderRadius:999,
            padding:"14px 32px",fontSize:16,fontWeight:900,color:C.brown,
            border:"none",boxShadow:musicOn?"0 5px 0 rgba(180,120,0,.2)":"0 3px 0 rgba(0,0,0,.1)"}}>
            {musicOn?"🎵 音樂開啟":"🔇 音樂關閉"}
          </button>
          <div style={{fontSize:10,color:C.soft,fontWeight:800,marginTop:12}}>
            第一次需要點一下畫面才能播放
          </div>
        </div>
      </>}

      {ptab==="reset"&&<>
        <div style={{...bub("#fff5f5",20),padding:"18px 14px",marginBottom:14,textAlign:"center",border:"none",background:"#fff5f5"}}>
          <div style={{fontSize:34,marginBottom:8}}>⚠️</div>
          <div style={{fontSize:15,fontWeight:900,color:"#cc3333",marginBottom:6}}>格式化 / 重新開始</div>
          <div style={{fontSize:11,color:"#888",fontWeight:800,lineHeight:1.7}}>
            清除所有資料（點數、任務、寵物、願望）<br/>
            <span style={{color:"#cc3333",fontWeight:900}}>此操作無法復原！</span>
          </div>
        </div>
        {!rst
          ?<button className="btn" onClick={()=>setRst(true)}
            style={{...bub("#FFB0B0"),width:"100%",padding:"13px 0",borderRadius:999,
              fontSize:14,fontWeight:900,color:"#cc0000",border:"none"}}>我要重新開始</button>
          :<>

            <button className="btn" onClick={()=>setRst(false)}

                fontSize:14,fontWeight:900,color:C.soft,border:"none"}}>取消</button>

      </>}

      <div style={{textAlign:"center",marginTop:16,paddingTop:12,borderTop:"1px solid rgba(100,70,30,.08)"}}>
        <a href="https://www.instagram.com/hello.maggie/" target="_blank" rel="noopener noreferrer"
          style={{display:"inline-flex",alignItems:"center",gap:5,fontSize:10,fontWeight:900,color:C.soft,textDecoration:"none"}}>
          ✨ 作者：<span style={{color:"#C35A8A"}}>@hello.maggie</span>
        </a>
      </div>

      <button className="btn" onClick={onClose}
        style={{...bub(C.light),width:"100%",padding:"12px 0",borderRadius:999,
          fontSize:13,fontWeight:900,color:C.soft,marginTop:14,border:"none"}}>關閉</button>
    </Overlay>);
}

/* ═══════════════ MAIN APP ═══════════════ */
function App(){

  const [ballVisible,setBallVisible]=useState(false);
  const [ballX,setBallX]=useState(70);

  const [tab,setTab]=useState("home");
  const [modal,setModal]=useState(null);
  const [shopTab,setShopTab]=useState("food");
  const [toast,setToast]=useState({msg:"",color:C.butter});
  const [speech,setSpeech]=useState("");
  const [toyPlaying,setToyPlaying]=useState(null);
  const [running,setRunning]=useState(false);
  const [eating,setEating]=useState(false);
  const [petAction,setPetAction]=useState("idle");
  const [petRoomX,setPetRoomX]=useState(50);
  const [actionText,setActionText]=useState("");
  const [horseX,setHorseX]=useState(48);
  const [feedItem,setFeedItem]=useState(null);
  const [showFood,setShowFood]=useState(false);
  const [avatarGender,setAvatarGender]=useState("girl");
  const [avatarSkin,setAvatarSkin]=useState("#F6D2B8");
  const [dMood,setDMood]=useState(3);
  const [dText,setDText]=useState("");
  const [dSaved,setDSaved]=useState(false);
  const [diaryDate,setDiaryDate]=useState(new Date().toLocaleDateString("zh-TW"));
  const [calMonth,setCalMonth]=useState(new Date());

  // wish form
  const [nWLabel,setNWLabel]=useState("");
  const [nWEmoji,setNWEmoji]=useState("🌟");
  const [nWPts,setNWPts]=useState(100);

  const tRef=useRef();
  const actionRef=useRef();
  const parkPetDragRef=useRef(null);
  const parkKidDragRef=useRef(null);

  // persist
  useEffect(()=>{
    try{const s=JSON.parse(localStorage.getItem("habitKingdom")||"{}");
      if(s.profile)setProfile(s.profile);if(s.points!=null)setPoints(s.points);
      if(s.tasks)setTasks(s.tasks);else setTasks(DEFAULT_TASKS);
      if(s.checked)setChecked(s.checked);if(s.owned)setOwned(s.owned);
      if(s.equipped)setEquipped(s.equipped);if(s.backpack)setBackpack(s.backpack);
      if(s.hunger!=null)setHunger(s.hunger);if(s.diary)setDiary(s.diary);
      if(s.wishes)setWishes(s.wishes);if(s.bonusTasks)setBonusTasks(s.bonusTasks);
      if(s.achievements)setAchievements(s.achievements);if(s.streak!=null)setStreak(s.streak);
      if(s.petMood!=null)setPetMood(s.petMood);if(s.poops)setPoops(s.poops);
      if(s.neglect)setNeglect(s.neglect);
    }catch(e){}
  },[]);

  useEffect(()=>{
    if(!profile)return;
    localStorage.setItem("habitKingdom",JSON.stringify({
      profile,points,tasks,checked,owned,equipped,backpack,hunger,diary,wishes,bonusTasks,achievements,streak,petMood,poops,neglect}));
  },[profile,points,tasks,checked,owned,equipped,backpack,hunger,diary,wishes,bonusTasks,achievements,streak,petMood,poops,neglect]);

  // 音樂啟動 - 第一次點擊頁面時啟動
  useEffect(()=>{
    if(!profile)return;
    const startOnClick=()=>{
      if(musicOn){Audio.startMusic(true);}
      document.removeEventListener("click",startOnClick);
      document.removeEventListener("touchstart",startOnClick);
    };
    document.addEventListener("click",startOnClick);
    document.addEventListener("touchstart",startOnClick);
    return()=>{
      document.removeEventListener("click",startOnClick);
      document.removeEventListener("touchstart",startOnClick);
    };
  },[profile,musicOn]);
  useEffect(()=>{
    if(!profile)return;
    const today=new Date().toLocaleDateString("zh-TW");
    const last=localStorage.getItem("lastLogin_hk");
    if(last!==today){
      if(last){
        const prev=new Date(last),now=new Date();prev.setHours(0,0,0,0);now.setHours(0,0,0,0);
        const gap=Math.round((now-prev)/(1000*60*60*24));
        if(gap>=7)setNeglect({level:7,sleeping:true,roomMess:true,dirty:true,cost:20,needsBath:true,welcomePending:true});
        else if(gap>=5)setNeglect({level:5,sleeping:true,roomMess:true,dirty:true,cost:10,needsBath:true,welcomePending:false});
        else if(gap>=3)setNeglect({level:3,sleeping:true,roomMess:true,dirty:false,cost:0,needsBath:false,welcomePending:false});
      }
      localStorage.setItem("lastLogin_hk",today);
      setPoints(p=>p+5);
      setTimeout(()=>{toast2("每日登入！+5⭐ 可以買蘋果囉🍎","#88cc88");Audio.login();},900);
    }
    // 清理3天前的任務記錄
    setChecked(prev=>{
      const cleaned={};
      const now=new Date();
      Object.keys(prev).forEach(key=>{
        // key格式: kid-日期-id 或 ok-日期-id 或 wkid-日期-id 或 wkok-日期-id
        const parts=key.split("-");
        if(parts.length>=3){
          // 取出日期部分（第2個-之後，最後一個-之前）
          const dateStr=parts.slice(1,parts.length-1).join("-");
          try{
            const d=new Date(dateStr);
            const diffDays=(now-d)/(1000*60*60*24);
            if(diffDays<=3)cleaned[key]=prev[key];
          }catch(e){cleaned[key]=prev[key];}
        }else{cleaned[key]=prev[key];}
      });
      return cleaned;
    });
  },[profile]);

  // 舊存檔第一次升級時，讓孩子自己建立小主人；不動原本任務與點數
  useEffect(()=>{
    if(profile&&!profile.gender&&modal==null)setModal("avatarSetup");
  },[profile]);

  useEffect(()=>{
    if(profile&&profile.gender&&neglect.welcomePending&&modal==null)setModal("welcomeBack");
  },[profile,neglect.welcomePending,modal]);

  // streak check
  useEffect(()=>{
    if(!profile)return;
    const day=new Date().getDay();
    const today=new Date().toLocaleDateString("zh-TW");
    const allDone=tasks.every(h=>!!checked["ok-"+today+"-"+h.id]);
    if(!allDone)return;
    const lastS=localStorage.getItem("lastStreak_hk");
    if(lastS===today)return;
    const yest=new Date();yest.setDate(yest.getDate()-1);
    const yStr=yest.toLocaleDateString("zh-TW");
    const ns=lastS===yStr?streak+1:1;
    setStreak(ns);
    localStorage.setItem("lastStreak_hk",today);
    if(ns===3){toast2("連續3天全部完成！🔥 成就解鎖！","#FF9F3F");unlockAch("a8");}
    if(ns===7){setPoints(p=>p+100);toast2("連續7天！🎉 獎勵+100⭐","#FFD700");unlockAch("a9");}
    if(ns===5){toast2("連續5天！⭐ 超厲害！","#FF9F3F");}
    unlockAch("a10");
  },[checked,profile]);

  // poop - 更可靠的觸發機制
  useEffect(()=>{
    const POOP_HOURS=[7,17,20];
    const check=()=>{
      const now=new Date();
      const h=now.getHours();
      const dateStr=now.toLocaleDateString("zh-TW");
      if(POOP_HOURS.indexOf(h)>=0){
        const key=dateStr+"-h"+h;
        setPoops(ps=>{
          if(ps.find(p=>p.key===key))return ps;
          return [...ps,{key,time:h+":00"}];
        });
      }
    };
    check();
    const t=setInterval(check,30000); // 每30秒檢查一次
    return()=>clearInterval(t);
  },[]);

  useEffect(()=>{if(poops.length>0)setPetMood(m=>Math.max(0,m-4));},[poops.length]);
  useEffect(()=>{const t=setInterval(()=>setHunger(h=>Math.max(0,h-2)),45000);return()=>clearInterval(t);},[]);

  const toast2=useCallback((msg,color)=>{
    setToast({msg,color:color||C.butter});
    if(tRef.current)clearTimeout(tRef.current);
    tRef.current=setTimeout(()=>setToast({msg:"",color:C.butter}),2800);
  },[]);

  const unlockAch=useCallback((id)=>{
    setAchievements(prev=>{
      if(prev.indexOf(id)>=0)return prev;
      const a=ACHIEVEMENTS.find(x=>x.id===id);
      if(a){setTimeout(()=>toast2("🏅 成就解鎖："+a.label+"！"),400);Audio.achieve();}
      return [...prev,id];
    });
  },[]);

  const startPetAction=useCallback((action,text,x,duration)=>{
    if(actionRef.current)clearTimeout(actionRef.current);
    setPetAction(action);setActionText(text||"");
    if(x!=null)setPetRoomX(x);
    actionRef.current=setTimeout(()=>{setPetAction("idle");setActionText("");setPetRoomX(50);},duration||3800);
  },[]);

  // 房間裡的自主生活：散步、打哈欠、睡覺、看窗與使用已放置家具
  useEffect(()=>{
    if(!profile||tab!=="room"||roomEdit||neglect.sleeping)return;
    const live=()=>{
      const actions=[
        {action:"walk",text:"在房間散散步～",x:Math.random()>.5?36:64,duration:4200},
        {action:"yawn",text:"哈啊～有一點想睡了",x:50,duration:3200},
        {action:"sleep",text:"呼嚕……做個好夢 💤",x:50,duration:5200},
        {action:"window",text:"窗外今天看起來真漂亮",x:54,duration:4000},
      ];
      Object.keys(FURNITURE_ACTIONS).forEach(id=>{
        if(Object.values(equipped).indexOf(id)>=0)actions.push({...FURNITURE_ACTIONS[id],duration:4200});
      });
      const a=actions[Math.floor(Math.random()*actions.length)];startPetAction(a.action,a.text,a.x,a.duration);
    };
    const first=setTimeout(live,2200),timer=setInterval(live,9000);
    return()=>{clearTimeout(first);clearInterval(timer);};
  },[profile,tab,roomEdit,equipped,neglect.sleeping,startPetAction]);

  if(!profile)return <Onboarding onDone={p=>{setProfile(p);if(p.tasks)setTasks(p.tasks);}}/>;

  // computed

  const NAVS=[

      {modal&&modal.startsWith("ach-")&&(()=>{
        const id=modal.slice(4);

            「好久不見，我真的好想你！」
          </div>
          <div style={{fontSize:11,fontWeight:800,color:C.soft,lineHeight:1.7,marginBottom:16}}>
            房間需要整理，{profile.petName}也想洗個舒服的澡。<br/>先抱一下，再一起慢慢恢復吧！
          </div>
          <button className="btn" onClick={()=>{setNeglect(n=>({...n,welcomePending:false,sleeping:false}));setModal(null);setTab("room");setTimeout(()=>startPetAction("hug","最喜歡你回來了！🤗",46,4200),250);}}

      {modal==="avatarSetup"&&<Overlay onClose={()=>{}}>

          </div>

            {["#F6D2B8","#DFAE88","#A96F4F"].map(c=><button key={c} className="btn" onClick={()=>setAvatarSkin(c)} aria-label="選擇膚色"

                    </button>);})}
              </div>
            </div>)}

          {/* 我的裝飾儲藏間 */}
          {ROOMITEMS.filter(i=>owned.indexOf(i.id)>=0).length>0&&(
            <div style={{...cardS(C.card),padding:12,marginBottom:10}}>
              {/* header */}
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
                <div style={{...bub(C.yellow,999),padding:"4px 12px",border:"none"}}>
                  <span style={{fontSize:12,fontWeight:900,color:C.brown}}>🏠 我的裝飾</span>
                </div>
                <div style={{fontSize:10,color:C.soft,fontWeight:800}}>
                  點裝飾放入房間，再點移除
                </div>
              </div>

              {/* 壁紙區 */}
              {ROOMITEMS.filter(i=>i.type==="wp"&&owned.indexOf(i.id)>=0).length>0&&<>
                <div style={{fontSize:10,color:C.soft,fontWeight:900,marginBottom:7}}>🖼️ 壁紙</div>
                <div style={{display:"flex",gap:7,flexWrap:"wrap",marginBottom:12}}>
                  {ROOMITEMS.filter(i=>i.type==="wp"&&owned.indexOf(i.id)>=0).map(d=>{
                    const isEq=equipped.wp===d.id;
                    return(
                      <button key={d.id} className="btn"
                        onClick={()=>setEquipped(e=>({...e,wp:isEq?undefined:d.id}))}
                        style={{...bub(isEq?C.yellow:C.light),borderRadius:14,
                          padding:"8px 12px",textAlign:"center",border:"none",
                          outline:isEq?"3px solid "+C.butter:"none",minWidth:64}}>
                        <div style={{fontSize:22}}>{d.emoji}</div>
                        <div style={{fontSize:9,fontWeight:900,color:C.brown}}>{d.label}</div>
                        {isEq
                          ?<div style={{fontSize:8,color:"#2a8a2a",fontWeight:900}}>✓ 使用中</div>
                          :<div style={{fontSize:8,color:C.soft,fontWeight:800}}>點擊使用</div>}
                      </button>);})}
                </div>
              </>}

              {/* 位置裝飾區 - 按slot分組 */}
              {ROOM_SLOTS.map(slot=>{
                const slotItems=ROOMITEMS.filter(r=>r.type==="dc"&&r.slot===slot.id&&owned.indexOf(r.id)>=0);
                if(slotItems.length===0)return null;
                const placed=ROOMITEMS.find(r=>r.id===equipped[slot.id]);
                return(
                  <div key={slot.id} style={{marginBottom:12}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:7}}>
                      <div style={{fontSize:10,color:C.soft,fontWeight:900}}>📍{slot.label}</div>
                      {placed
                        ?<span style={{...bub(C.green,999),padding:"1px 8px",fontSize:9,
                          fontWeight:900,color:"#1a6a1a",border:"none"}}>
                          {placed.emoji} 已放置
                        </span>
                        :<span style={{...bub(C.light,999),padding:"1px 8px",fontSize:9,
                          fontWeight:800,color:C.soft,border:"none"}}>空位
                        </span>}
                    </div>
                    <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                      {slotItems.map(d=>{
                        const isPlaced=equipped[slot.id]===d.id;
                        return(
                          <button key={d.id} className="btn"
                            onClick={()=>{
                              setEquipped(e=>({...e,[slot.id]:isPlaced?undefined:d.id}));
                              if(!isPlaced)toast2(d.emoji+" "+d.label+"放進房間了！","#88cc88");
                            }}
                            style={{...bub(isPlaced?C.yellow:C.light),borderRadius:14,
                              padding:"9px 11px",textAlign:"center",border:"none",
                              outline:isPlaced?"3px solid "+C.butter:"none",minWidth:60}}>
                            <div style={{fontSize:24}}>{d.emoji}</div>
                            <div style={{fontSize:9,fontWeight:900,color:C.brown,marginTop:2}}>{d.label}</div>
                            {isPlaced
                              ?<div style={{fontSize:8,color:"#2a8a2a",fontWeight:900}}>✓ 放置中</div>
                              :<div style={{fontSize:8,color:C.soft,fontWeight:800}}>點擊放入</div>}
                          </button>);})}
                    </div>
                  </div>);})}
            </div>)}

          {/* 還沒有任何裝飾 */}
          {ROOMITEMS.filter(i=>owned.indexOf(i.id)>=0).length===0&&(
            <div style={{...cardS(C.light),padding:"18px 14px",textAlign:"center",marginBottom:10}}>
              <div style={{fontSize:32,marginBottom:8}}>🏠</div>
              <div style={{fontSize:13,fontWeight:900,color:C.brown,marginBottom:4}}>還沒有裝飾</div>
              <div style={{fontSize:11,color:C.soft,fontWeight:800,marginBottom:12}}>去商店買裝飾來佈置房間吧！</div>
              <button className="btn" onClick={()=>setModal("shop")}
                style={{...bub(C.orange),borderRadius:999,padding:"9px 22px",
                  fontSize:12,fontWeight:900,color:"#fff",border:"none"}}>
                去商店 🛍️
              </button>
            </div>)}
        </div>
      )}

      {/* ══════════ WISH ══════════ */}
      {tab==="wish"&&(
        <div style={{padding:isTablet?"14px 22px 0":"10px 14px 0",
          maxWidth:isTablet?720:480,margin:"0 auto"}}>

          {/* star jar + points */}
          <div style={{...cardS(C.light),padding:"16px",marginBottom:12,
            display:"flex",alignItems:"center",justifyContent:"space-around"}}>
            <div style={{textAlign:"center"}}>
              <StarJar stars={points} max={activeWish?activeWish.pts:500} size={isTablet?1.3:1}/>
              <div style={{fontSize:fs(10),color:C.soft,fontWeight:800,marginTop:4}}>目前⭐</div>
            </div>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:fs(28),fontWeight:900,color:C.brown}}>⭐{points}</div>
              <div style={{fontSize:fs(11),color:C.soft,fontWeight:800}}>累積星星</div>
              {activeWish&&<div style={{fontSize:fs(10),color:points>=activeWish.pts?"#2a8a2a":"#d04040",
                fontWeight:900,marginTop:6}}>
                目標：{activeWish.label}<br/>
                {points>=activeWish.pts?"夠了！可以申請！":"還差"+(activeWish.pts-points)+"⭐"}
              </div>}
            </div>
          </div>

          {/* add wish */}
          <div style={{...cardS(C.card),padding:"14px 16px",marginBottom:12}}>
            <div style={{fontSize:fs(13),fontWeight:900,color:C.brown,marginBottom:10}}>✨ 許一個新願望</div>
            <div style={{display:"flex",gap:8,marginBottom:10}}>
              <input style={{...bub(C.light),borderRadius:16,padding:"9px 10px",
                width:46,fontSize:22,textAlign:"center",border:"none",flexShrink:0}}
                value={nWEmoji} onChange={e=>setNWEmoji(e.target.value)} maxLength={2}/>
              <input style={{...bub(C.light),borderRadius:16,padding:"9px 12px",flex:1,
                fontSize:fs(13),fontWeight:800,color:C.brown,border:"none"}}
                placeholder="我的願望是…" value={nWLabel} onChange={e=>setNWLabel(e.target.value)} maxLength={20}/>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:fs(12),color:C.soft,fontWeight:800}}>我覺得需要：</span>
              <input type="number" inputMode="numeric" min="10" max="2000" value={nWPts}
                onChange={e=>setNWPts(Number(e.target.value))}
                style={{width:70,...bub(C.light),borderRadius:12,padding:"5px 8px",
                  fontSize:fs(14),fontWeight:900,color:C.brown,border:"none",textAlign:"center"}}/>
              <span style={{fontSize:fs(12),color:C.soft,fontWeight:800}}>⭐</span>
              <button className="btn" onClick={()=>{
                if(!nWLabel.trim())return;
                setWishes(ws=>[...ws,{id:Date.now(),emoji:nWEmoji,label:nWLabel.trim(),
                  kidPts:nWPts,pts:nWPts,status:"pending"}]);
                setNWLabel("");setNWEmoji("🌟");setNWPts(100);
                toast2("願望送給爸媽了！等確認點數 💛");
              }} style={{...bub(C.orange),marginLeft:"auto",borderRadius:999,
                padding:"8px 16px",fontSize:fs(12),fontWeight:900,color:"#fff",border:"none",
                boxShadow:"0 4px 0 rgba(180,80,0,.2)"}}>送出！</button>
            </div>
          </div>

          {/* wish list - active */}
          {wishes.filter(w=>w.status==="active").length>0&&<>
            <div style={{...bub(C.yellow),borderRadius:999,padding:"3px 14px",
              display:"inline-block",marginBottom:10}}>
              <span style={{fontSize:fs(12),fontWeight:900,color:C.brown}}>🌟 進行中的願望</span>
            </div>
            {wishes.filter(w=>w.status==="active").map(w=>(
              <div key={w.id} style={{...cardS(C.card),padding:"13px 15px",marginBottom:9,
                display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontSize:26}}>{w.emoji||"🌟"}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:900,fontSize:fs(13),color:C.brown}}>{w.label}</div>
                  <div style={{marginTop:6,background:"rgba(0,0,0,.07)",borderRadius:99,height:9,overflow:"hidden"}}>
                    <div style={{width:Math.min(100,(points/w.pts*100))+"%",height:"100%",borderRadius:99,
                      background:"linear-gradient(90deg,"+C.butter+","+C.orange+")",transition:"width .5s"}}/>
                  </div>
                  <div style={{fontSize:fs(10),color:points>=w.pts?"#2a8a2a":"#d04040",fontWeight:800,marginTop:3}}>
                    {points}⭐ / {w.pts}⭐ {points>=w.pts?"✓ 夠了！":""}</div>
                </div>
                {points>=w.pts&&(
                  <button className="btn" onClick={()=>{
                    setWishes(ws=>ws.map(x=>x.id===w.id?{...x,status:"requesting"}:x));
                    toast2("申請送出！等爸媽確認 🌠","#b35cf8");
                  }} style={{...bub(C.orange),borderRadius:999,padding:"8px 13px",
                    fontSize:fs(11),fontWeight:900,color:"#fff",border:"none"}}>申請！</button>)}
              </div>))}
          </>}

          {/* pending */}
          {wishes.filter(w=>w.status==="requesting"||w.status==="pending").length>0&&<>
            <div style={{...bub(C.peach),borderRadius:999,padding:"3px 14px",
              display:"inline-block",marginBottom:10,marginTop:4}}>
              <span style={{fontSize:fs(12),fontWeight:900,color:C.brown}}>⏳ 等待爸媽確認</span>
            </div>
            {wishes.filter(w=>w.status==="requesting"||w.status==="pending").map(w=>(
              <div key={w.id} style={{...cardS(C.peach),padding:"12px 15px",marginBottom:8,
                display:"flex",alignItems:"center",gap:12}}>
                <span style={{fontSize:24}}>{w.emoji||"🌟"}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:900,fontSize:fs(12),color:C.brown}}>{w.label}</div>
                  <div style={{fontSize:fs(10),color:C.soft,fontWeight:800}}>等爸媽設定點數並核准…</div>
                </div>
                <span style={{fontSize:20}}>⏳</span>
              </div>))}
          </>}

          {/* done */}
          {wishes.filter(w=>w.status==="done").length>0&&<>
            <div style={{...bub(C.green),borderRadius:999,padding:"3px 14px",
              display:"inline-block",marginBottom:10,marginTop:4}}>
              <span style={{fontSize:fs(12),fontWeight:900,color:C.brown}}>🎉 已實現的願望</span>
            </div>
            {wishes.filter(w=>w.status==="done").map(w=>(
              <div key={w.id} style={{...cardS(C.green),padding:"12px 15px",marginBottom:8,
                display:"flex",alignItems:"center",gap:12,opacity:.8}}>
                <span style={{fontSize:24}}>{w.emoji||"🌟"}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:900,fontSize:fs(12),color:C.brown}}>{w.label}</div>
                  <div style={{fontSize:fs(10),color:"#2a8a2a",fontWeight:800}}>願望成真了！🎉</div>
                </div>
                <span style={{fontSize:20}}>✅</span>
              </div>))}
          </>}

          {wishes.length===0&&<div style={{textAlign:"center",padding:30}}>
            <div style={{fontSize:40,marginBottom:10}}>🌟</div>
            <div style={{fontSize:fs(14),fontWeight:900,color:C.brown,marginBottom:6}}>還沒有願望</div>
            <div style={{fontSize:fs(11),color:C.soft,fontWeight:800}}>許一個願望，努力存星星吧！</div>
          </div>}
        </div>
      )}

      {/* ══════════ NAV ══════════ */}
      <div style={{position:"fixed",bottom:0,left:0,right:0,maxWidth:768,margin:"0 auto",
        background:"rgba(255,251,240,.97)",backdropFilter:"blur(14px)",
        borderTop:"2px solid rgba(255,210,140,.28)",
        display:"flex",padding:isTablet?"6px 16px":"4px 8px",
        paddingBottom:"env(safe-area-inset-bottom,8px)",gap:4,
        height:isTablet?84:70,alignItems:"center"}}>
        {NAVS.map(n=>(
          <button key={n.k} className="btn" onClick={()=>n.k==="calendar"?setModal("calendar"):setTab(n.k)}
            style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",
              justifyContent:"center",gap:2,
              padding:isTablet?"10px 0":"7px 0",
              ...bub((tab===n.k||(n.k==="calendar"&&modal==="calendar"))?C.yellow:"transparent"),
              borderRadius:(tab===n.k||(n.k==="calendar"&&modal==="calendar"))?999:0,
              boxShadow:(tab===n.k||(n.k==="calendar"&&modal==="calendar"))?"0 4px 0 rgba(0,0,0,.08)":"none",
              border:"none",color:C.brown,
              fontSize:isTablet?12:9,fontWeight:900,
              margin:(tab===n.k||(n.k==="calendar"&&modal==="calendar"))?"2px 2px":"0",
              minHeight:isTablet?60:48}}>
            <span style={{fontSize:isTablet?26:20}}>{n.icon}</span>
            {n.l}
          </button>))}
      </div>
    </div>);
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
